<style>

<script>
// ==== GLOW SWARM CORE (shared by game + headless sim) ====
var CFG={pHp:100,pSpd:150,eHpBase:8,eHpGrow:0.08,eSpdBase:55,spawnBase:1.1,spawnGrow:0.55,eDmg:8,xpBase:5,xpGrow:1.12,bossHp:[900,2600],runLen:600,magnet:95,iframe:0.45};
var WEAP={
 pulse:{n:'Pulse Bolt',d:'Fires at nearest foe',max:6,evo:'cascade',evoNeed:'focus'},
 orbit:{n:'Halo Orbs',d:'Orbs circle you',max:6,evo:'eclipse',evoNeed:'reach'},
 nova:{n:'Shock Nova',d:'Periodic ring blast',max:6,evo:'supernova',evoNeed:'amp'},
 lance:{n:'Prism Lance',d:'Piercing beam forward',max:6,evo:'spectrum',evoNeed:'swift'},
 mine:{n:'Spark Mines',d:'Drops exploding mines',max:6,evo:'minefield',evoNeed:'vital'}};
var PASS={
 focus:{n:'Focus Lens',d:'-8% cooldowns',max:5},
 reach:{n:'Wide Field',d:'+12% area',max:5},
 amp:{n:'Amplifier',d:'+12% damage',max:5},
 swift:{n:'Glide Boots',d:'+8% move speed',max:5},
 vital:{n:'Vital Core',d:'+20 max HP, regen',max:5},
 lure:{n:'Lure Coil',d:'+35% pickup range',max:5}};
var EVO={cascade:'Cascade Storm',eclipse:'Eclipse Ring',supernova:'Supernova',spectrum:'Spectrum Ray',minefield:'Chain Minefield'};
function rng(seed){var s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function newGame(opt){opt=opt||{};var R=opt.rand||Math.random,meta=opt.meta||{hp:0,dmg:0,spd:0,xp:0};
 return {R:R,t:0,over:false,win:false,kills:0,lvl:1,xp:0,xpNext:CFG.xpBase,pendingLv:0,choices:null,
  p:{x:0,y:0,hp:CFG.pHp+meta.hp*10,mhp:CFG.pHp+meta.hp*10,inv:0,fx:1,fy:0},
  meta:meta,w:{pulse:1},ps:{},evo:{},cd:{},en:[],bl:[],gems:[],mines:[],fx:[],spawnAcc:0,bossDone:[false,false],boss:null,shards:0,events:[]};}
function stat(g,k){var l=g.ps[k]||0;switch(k){case'focus':return 1-0.08*l;case'reach':return 1+0.12*l;case'amp':return (1+0.12*l)*(1+0.08*g.meta.dmg);case'swift':return (1+0.08*l)*(1+0.05*g.meta.spd);case'lure':return 1+0.35*l;}return l;}
function emit(g,e){if(g.events.length<400)g.events.push(e);}
function spawnEnemy(g,type){var a=g.R()*6.283,d=420+g.R()*80,m=g.t/60;
 var hp=CFG.eHpBase*(1+CFG.eHpGrow*m*m*0.5+m*0.35),sp=CFG.eSpdBase*(1+m*0.04),r=11,col=0,xp=1;
 if(type==1){hp*=3.2;sp*=0.7;r=17;col=1;xp=4;} if(type==2){hp*=0.6;sp*=1.7;r=8;col=2;xp=1;}
 if(type==9){hp=CFG.bossHp[g.bossDone[0]?1:0];sp=CFG.eSpdBase*0.85;r=40;col=9;xp=60;}
 var e={x:g.p.x+Math.cos(a)*d,y:g.p.y+Math.sin(a)*d,hp:hp,mhp:hp,sp:sp,r:r,t:type,col:col,xp:xp,hit:0};
 g.en.push(e);if(type==9){g.boss=e;emit(g,{k:'boss'});}return e;}
function nearest(g,max){var b=null,bd=max*max;for(var i=0;i<g.en.length;i++){var e=g.en[i],dx=e.x-g.p.x,dy=e.y-g.p.y,d=dx*dx+dy*dy;if(d<bd&&e.hp>0){bd=d;b=e;}}return b;}
function hurt(g,e,dmg,kx,ky){if(e.hp<=0)return;e.hp-=dmg;e.hit=0.12;if(e.t!=9){e.x+=kx||0;e.y+=ky||0;}emit(g,{k:'dmg',x:e.x,y:e.y,v:Math.round(dmg)});
 if(e.hp<=0){g.kills++;g.gems.push({x:e.x,y:e.y,v:e.xp});emit(g,{k:'kill',x:e.x,y:e.y,c:e.col,big:e.t==9});
  if(e.t==9){g.boss=null;g.shards+=25;if(g.bossDone[1]){g.win=true;g.over=true;}}}}
function rollChoices(g){var pool=[],k,l;for(k in WEAP){l=g.w[k]||0;if(g.evo[k])continue;
  if(l>=WEAP[k].max&&(g.ps[WEAP[k].evoNeed]||0)>0){pool.push({k:k,type:'evo',n:EVO[WEAP[k].evo],d:'EVOLUTION of '+WEAP[k].n});continue;}
  if(l<WEAP[k].max&&(l>0||Object.keys(g.w).length<4))pool.push({k:k,type:'w',n:WEAP[k].n,d:WEAP[k].d,l:l+1});}
 for(k in PASS){l=g.ps[k]||0;if(l<PASS[k].max&&(l>0||Object.keys(g.ps).length<4))pool.push({k:k,type:'p',n:PASS[k].n,d:PASS[k].d,l:l+1});}
 var out=[],evo=pool.filter(function(c){return c.type=='evo';});if(evo.length)out.push(evo[0]);
 pool=pool.filter(function(c){return c.type!='evo';});
 while(out.length<3&&pool.length)out.push(pool.splice(Math.floor(g.R()*pool.length),1)[0]);
 while(out.length<3)out.push({k:'heal',type:'h',n:'Glow Snack',d:'Heal 40 HP'});return out;}
function choose(g,i){var c=g.choices&&g.choices[i];if(!c)return;
 if(c.type=='w')g.w[c.k]=(g.w[c.k]||0)+1;else if(c.type=='p'){g.ps[c.k]=(g.ps[c.k]||0)+1;if(c.k=='vital'){g.p.mhp+=20;g.p.hp+=20;}}
 else if(c.type=='evo'){g.evo[c.k]=1;emit(g,{k:'evo'});}else g.p.hp=Math.min(g.p.mhp,g.p.hp+40);
 g.choices=null;g.pendingLv--;if(g.pendingLv>0)g.choices=rollChoices(g);}
function fireWeapons(g,dt){var amp=stat(g,'amp'),cdm=stat(g,'focus'),area=stat(g,'reach'),P=g.p,k,j,e;
 for(k in g.w){var l=g.w[k],ev=g.evo[k];g.cd[k]=(g.cd[k]||0)-dt;
  if(k=='orbit'){var n=ev?6:1+Math.ceil(l/2),rad=(60+l*6)*area,ang=g.t*(ev?4.2:3);
   for(var i=0;i<n;i++){var a=ang+i*6.283/n,ox=P.x+Math.cos(a)*rad,oy=P.y+Math.sin(a)*rad;
    for(j=0;j<g.en.length;j++){e=g.en[j];var dx=e.x-ox,dy=e.y-oy;if(dx*dx+dy*dy<(e.r+12)*(e.r+12)&&e.hit<=0)hurt(g,e,(6+l*3)*amp*(ev?2:1),dx*0.3,dy*0.3);}}continue;}
  if(g.cd[k]>0)continue;
  if(k=='pulse'){g.cd[k]=(ev?0.25:0.85-l*0.06)*cdm;var cnt=ev?3:1+Math.floor(l/3),t=nearest(g,460);if(!t){g.cd[k]=0.1;continue;}
   for(var c=0;c<cnt;c++){var a2=Math.atan2(t.y-P.y,t.x-P.x)+(c-(cnt-1)/2)*0.18;g.bl.push({x:P.x,y:P.y,vx:Math.cos(a2)*430,vy:Math.sin(a2)*430,d:(10+l*4)*amp,life:1.1,pierce:ev?3:1,r:5,hits:[]});}emit(g,{k:'shot'});}
  else if(k=='nova'){g.cd[k]=(ev?1.6:3.2-l*0.2)*cdm;var R2=(90+l*14)*area*(ev?1.6:1);g.fx.push({k:'ring',x:P.x,y:P.y,r:R2,t:0.35,m:0.35});
   for(j=0;j<g.en.length;j++){e=g.en[j];var dx2=e.x-P.x,dy2=e.y-P.y,d2=Math.sqrt(dx2*dx2+dy2*dy2)||1;if(d2<R2+e.r)hurt(g,e,(14+l*6)*amp*(ev?1.8:1),dx2/d2*25,dy2/d2*25);}emit(g,{k:'nova'});}
  else if(k=='lance'){g.cd[k]=(ev?0.7:1.6-l*0.1)*cdm;var dirs=ev?[0,1.571,3.142,4.712]:[0],base=Math.atan2(P.fy,P.fx);
   for(var q=0;q<dirs.length;q++){var aa=base+dirs[q],cx=Math.cos(aa),cy=Math.sin(aa),L=320*area,W=14*area;g.fx.push({k:'beam',x:P.x,y:P.y,a:aa,L:L,t:0.18,m:0.18});
    for(j=0;j<g.en.length;j++){e=g.en[j];var rx=e.x-P.x,ry=e.y-P.y,pr=rx*cx+ry*cy,pe=Math.abs(-rx*cy+ry*cx);if(pr>0&&pr<L&&pe<W+e.r)hurt(g,e,(18+l*7)*amp,cx*12,cy*12);}}emit(g,{k:'lance'});}
  else if(k=='mine'){g.cd[k]=(ev?0.9:2.2-l*0.15)*cdm;var nm=ev?3:1;for(var m=0;m<nm;m++)g.mines.push({x:P.x+(m?(g.R()-0.5)*160:0),y:P.y+(m?(g.R()-0.5)*160:0),t:ev?0.6:1.2,r:(70+l*8)*area,d:(30+l*10)*amp,chain:ev});}}
}
function gainXp(g,v){g.xp+=v*(1+0.1*g.meta.xp);while(g.xp>=g.xpNext){g.xp-=g.xpNext;g.lvl++;g.xpNext=Math.floor(CFG.xpBase+Math.pow(g.lvl,CFG.xpGrow)*4);g.pendingLv++;emit(g,{k:'lvl'});}
 if(g.pendingLv>0&&!g.choices)g.choices=rollChoices(g);}
function step(g,dt,ix,iy){if(g.over||g.choices)return;g.t+=dt;var P=g.p,i,j,e;
 var il=Math.sqrt(ix*ix+iy*iy);if(il>1){ix/=il;iy/=il;il=1;}
 if(il>0.1){P.fx=ix/il;P.fy=iy/il;}var sp=CFG.pSpd*stat(g,'swift');P.x+=ix*sp*dt;P.y+=iy*sp*dt;
 if(g.ps.vital)P.hp=Math.min(P.mhp,P.hp+g.ps.vital*0.3*dt);P.inv-=dt;
 // spawning
 var m=g.t/60;if(m>=5&&!g.bossDone[0]){g.bossDone[0]=true;spawnEnemy(g,9);}
 if(g.t>=CFG.runLen&&!g.bossDone[1]){g.bossDone[1]=true;spawnEnemy(g,9);}
 var rate=(CFG.spawnBase+CFG.spawnGrow*m+0.06*m*m)*(g.boss?0.5:1);g.spawnAcc+=rate*dt;
 while(g.spawnAcc>=1&&g.en.length<260){g.spawnAcc-=1;var r=g.R(),ty=(m>2&&r<0.18)?1:(m>1&&r<0.38)?2:0;spawnEnemy(g,ty);}
 if(g.spawnAcc>5)g.spawnAcc=5;
 if(Math.floor(g.t/60)!=Math.floor((g.t-dt)/60)&&g.t>30){for(i=0;i<10+m*3;i++)spawnEnemy(g,2);emit(g,{k:'wave'});}
 fireWeapons(g,dt);
 // bullets
 for(i=g.bl.length-1;i>=0;i--){var b=g.bl[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  for(j=0;j<g.en.length&&b.pierce>0;j++){e=g.en[j];if(e.hp<=0||b.hits.indexOf(e)>=0)continue;var dx=e.x-b.x,dy=e.y-b.y;if(dx*dx+dy*dy<(e.r+b.r)*(e.r+b.r)){hurt(g,e,b.d,b.vx*0.02,b.vy*0.02);b.hits.push(e);b.pierce--;}}
  if(b.life<=0||b.pierce<=0)g.bl.splice(i,1);}
 // mines
 for(i=g.mines.length-1;i>=0;i--){var mn=g.mines[i];mn.t-=dt;if(mn.t<=0){g.fx.push({k:'boom',x:mn.x,y:mn.y,r:mn.r,t:0.3,m:0.3});emit(g,{k:'boom'});
   for(j=0;j<g.en.length;j++){e=g.en[j];var mx=e.x-mn.x,my=e.y-mn.y,md=Math.sqrt(mx*mx+my*my)||1;if(md<mn.r+e.r)hurt(g,e,mn.d,mx/md*20,my/md*20);}
   g.mines.splice(i,1);}}
 // enemies
 for(i=0;i<g.en.length;i++){e=g.en[i];if(e.hp<=0)continue;e.hit-=dt;var ex=P.x-e.x,ey=P.y-e.y,ed=Math.sqrt(ex*ex+ey*ey)||1;
  e.x+=ex/ed*e.sp*dt;e.y+=ey/ed*e.sp*dt;
  if(ed>900&&e.t!=9){var a=g.R()*6.283;e.x=P.x+Math.cos(a)*450;e.y=P.y+Math.sin(a)*450;}
  if(ed<e.r+12&&P.inv<=0){var dmg=CFG.eDmg*(e.t==9?2.5:e.t==1?1.5:1)*(1+m*0.06);P.hp-=dmg;P.inv=CFG.iframe;emit(g,{k:'hurt',v:dmg});
   if(P.hp<=0){P.hp=0;g.over=true;emit(g,{k:'die'});return;}}}
 // separation (cheap, neighbours only via index window)
 for(i=0;i<g.en.length;i++){e=g.en[i];var o=g.en[(i+1)%g.en.length];if(o===e)continue;var sx=e.x-o.x,sy=e.y-o.y,sd=sx*sx+sy*sy,rr=(e.r+o.r);if(sd<rr*rr&&sd>0.01){sd=Math.sqrt(sd);var push=(rr-sd)*0.5;e.x+=sx/sd*push;e.y+=sy/sd*push;o.x-=sx/sd*push;o.y-=sy/sd*push;}}
 g.en=g.en.filter(function(e){return e.hp>0;});
 // gems
 var mag=CFG.magnet*stat(g,'lure');for(i=g.gems.length-1;i>=0;i--){var gm=g.gems[i],gx=P.x-gm.x,gy=P.y-gm.y,gd=Math.sqrt(gx*gx+gy*gy)||1;
  if(gd<mag||gm.pull){gm.pull=1;var v=Math.min(gd,(260+gd*2)*dt);gm.x+=gx/gd*v;gm.y+=gy/gd*v;}
  if(gd<16){g.gems.splice(i,1);gainXp(g,gm.v);emit(g,{k:'gem'});}}
 if(g.gems.length>300){var s=0;for(i=0;i<100;i++)s+=g.gems[i].v;g.gems.splice(0,100);g.gems.push({x:P.x+50,y:P.y,v:s});}
 for(i=g.fx.length-1;i>=0;i--){g.fx[i].t-=dt;if(g.fx[i].t<=0)g.fx.splice(i,1);}
}
if(typeof module!=='undefined')module.exports={CFG:CFG,WEAP:WEAP,PASS:PASS,EVO:EVO,rng:rng,newGame:newGame,step:step,choose:choose,stat:stat};

</script>
<script>
(function(){
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=0,H=0,DPR=1,$=function(i){return document.getElementById(i);};
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',rs);rs();
var SAVE='glowswarm_v1',S={best:0,bestK:0,shards:0,meta:{hp:0,dmg:0,spd:0,xp:0},mute:false};
try{var ld=JSON.parse(localStorage.getItem(SAVE));if(ld){S=Object.assign(S,ld);S.meta=Object.assign({hp:0,dmg:0,spd:0,xp:0},ld.meta||{});}}catch(e){}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S));}catch(e){}}
var AC=null,master=null,musT=0,musStep=0;
function au(){if(AC){if(AC.state==='suspended')AC.resume();return AC;}try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}return AC;}
function tone(f,d,type,vol,slide){if(!AC||S.mute)return;var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
 g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}
var NB=null;function noise(d,vol,fq){if(!AC||S.mute)return;if(!NB){var n=AC.sampleRate|0;NB=AC.createBuffer(1,n,AC.sampleRate);var a=NB.getChannelData(0);for(var i=0;i<n;i++)a[i]=Math.random()*2-1;}
 var t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=fq||1200;g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d);}
var sfxCD={};function sfx(k){var now=performance.now();if(sfxCD[k]&&now-sfxCD[k]<60)return;sfxCD[k]=now;
 switch(k){case'shot':tone(880,0.06,'square',0.025,440);break;case'kill':tone(300+Math.random()*200,0.08,'triangle',0.05,90);break;case'gem':tone(1200+Math.random()*300,0.05,'sine',0.035);break;
 case'lvl':[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.15,'square',0.07);},i*70);});break;case'hurt':noise(0.15,0.25,600);tone(140,0.2,'sawtooth',0.08,60);break;
