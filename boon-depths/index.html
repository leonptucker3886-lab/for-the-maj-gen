<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0614"><title>Boon Depths</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0a0614;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4ecff;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:10px 12px;display:flex;gap:10px;align-items:center;pointer-events:none;font-weight:700;text-shadow:0 0 6px #000}
.bar{flex:1;max-width:200px;height:14px;border-radius:8px;background:#2a1838;overflow:hidden;border:1px solid #ff5fa2}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2e88,#ff9a5f);width:100%}
#pause{pointer-events:auto;margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid #7a5ca0;background:#1b1029cc;color:#fff;font-size:18px}
.btn{position:fixed;border-radius:50%;border:2px solid;background:#14091fcc;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;touch-action:none}
.btn small{font-size:10px;opacity:.8}
.btn .cd{position:absolute;inset:0;border-radius:50%;background:#000a;transform-origin:bottom;}
#bA{width:92px;height:92px;right:22px;bottom:calc(40px + env(safe-area-inset-bottom,0));border-color:#ff5fa2;box-shadow:0 0 18px #ff2e8866}
#bD{width:70px;height:70px;right:122px;bottom:calc(30px + env(safe-area-inset-bottom,0));border-color:#e7a8ff}
#bS{width:70px;height:70px;right:40px;bottom:calc(144px + env(safe-area-inset-bottom,0));border-color:#ff9a5f}
.ov{position:fixed;inset:0;background:#0a0614ee;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:auto;z-index:5}
.ov.on{display:flex}
h1{font-size:44px;margin:0 0 6px;letter-spacing:2px;background:linear-gradient(90deg,#ff2e88,#ffb35f,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff2e8888)}
h2{margin:0 0 12px}
.big{min-height:54px;min-width:220px;margin:6px;border-radius:14px;border:2px solid #ff5fa2;background:#2a1240;color:#fff;font-size:18px;font-weight:800}
.card{width:min(92vw,360px);margin:7px;padding:14px;border-radius:16px;border:2px solid;background:#1a0f2b;text-align:left;color:#fff;font-size:15px}
.card b{font-size:18px;display:block}
.muted{opacity:.75;font-size:14px}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"><div class="bar"><i id="hp"></i></div><span id="hpt"></span><span id="rm"></span><span id="em"></span><button id="pause">II</button></div>
<div class="btn" id="bD">DASH<div class="cd" id="cdD"></div></div>
<div class="btn" id="bS">FLARE<div class="cd" id="cdS"></div></div>
<div class="btn" id="bA">STRIKE<div class="cd" id="cdA"></div></div>
<div class="ov on" id="menu"></div><div class="ov" id="pick"></div>
<script>
// Boon Depths core (pure logic)
var BD=(function(){
var W=360,H=560;
function rng(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
var PATRONS={storm:{name:'Vela of Storms',col:'#7fd8ff'},ember:{name:'Korr of Embers',col:'#ff7a3d'},
 tide:{name:'Nerith of Tides',col:'#4fffc4'},gale:{name:'Sefa of Gales',col:'#e7a8ff'}};
var BOONS=[
 {id:'chain',p:'storm',n:'Chain Spark',d:'Strikes arc to 2 nearby foes.'},
 {id:'stormdash',p:'storm',n:'Thunder Step',d:'Dashing zaps foes you pass.'},
 {id:'static',p:'storm',n:'Static Charge',d:'+12% attack speed.'},
 {id:'burn',p:'ember',n:'Kindle',d:'Strikes burn foes for 3 sec.'},
 {id:'fury',p:'ember',n:'Furnace Heart',d:'+25% strike damage.'},
 {id:'nova',p:'ember',n:'Flare Burst',d:'Bigger, stronger special.'},
 {id:'heal',p:'tide',n:'Undertow',d:'Heal 6 HP per cleared chamber.'},
 {id:'shell',p:'tide',n:'Coral Ward',d:'Take 15% less damage.'},
 {id:'maxhp',p:'tide',n:'Deep Vigor',d:'+25 max HP and heal 25.'},
 {id:'swift',p:'gale',n:'Tailwind',d:'+15% move speed.'},
 {id:'dash2',p:'gale',n:'Twin Gust',d:'Dash recharges 35% faster.'},
 {id:'crit',p:'gale',n:'Keen Edge',d:'15% chance of double damage.'}];
var UPG={vit:{n:'Vitality',d:'+10 max HP',max:5,cost:[20,35,55,80,110]},
 might:{n:'Might',d:'+8% damage',max:5,cost:[25,40,60,90,120]},
 grace:{n:'Grace',d:'+1 death defiance',max:2,cost:[60,140]},
 luck:{n:'Fortune',d:'+10% embers',max:3,cost:[30,60,100]}};
var FT={grunt:{hp:26,sp:70,dmg:10,r:11,col:'#ff4d6d'},archer:{hp:20,sp:45,dmg:9,r:10,col:'#ffd23f',ranged:1},
 brute:{hp:60,sp:35,dmg:15,r:16,col:'#b04dff'},wisp:{hp:14,sp:95,dmg:6,r:8,col:'#3dfcff'},
 boss:{hp:1800,sp:45,dmg:18,r:30,col:'#ff2e88',ranged:1}};
function newRun(meta,seed){
 meta=meta||{};var r=rng(seed||((Date.now()*7)>>>0));
 var p={x:W/2,y:H-90,max:100+10*(meta.vit||0),r:12,face:-1,fx:0,atkCd:0,dashCd:0,dashT:0,spCd:0,inv:0,atkT:0,
  defy:meta.grace||0,boons:{},mult:1+0.08*(meta.might||0),zapped:[]};
 p.hp=p.max;
 var s={W:W,H:H,rand:r,p:p,room:0,rooms:12,foes:[],shots:[],fx:[],state:'fight',choices:null,
  embers:0,kills:0,t:0,meta:meta,dmgTaken:0,events:[]};
 spawnRoom(s);return s;}
function lvl(s,id){return s.p.boons[id]||0;}
function foe(s,t,x,y){var b=FT[t],sc=t==='boss'?1:1+(s.room-1)*0.2;
 return {t:t,x:x,y:y,hp:b.hp*sc,max:b.hp*sc,sp:b.sp,dmg:b.dmg*(t==='boss'?1:1+(s.room-1)*0.12),r:b.r,col:b.col,ranged:b.ranged,cd:1+s.rand()*1.5,burn:0,hit:0};}
function spawnRoom(s){
 s.room++;s.rt=0;s.foes=[];s.shots=[];var n=s.room,r=s.rand;s.p.x=W/2;s.p.y=H-90;
 if(n===s.rooms){s.foes.push(foe(s,'boss',W/2,140));s.events.push('boss');return;}
 var count=4+Math.floor(n*1.2),types=['grunt'];
 if(n>=3)types.push('archer');if(n>=5)types.push('brute');if(n>=8)types.push('wisp');
 for(var i=0;i<count;i++){var t=types[Math.floor(r()*types.length)];s.foes.push(foe(s,t,30+r()*(W-60),40+r()*(H*0.45)));}
}
function nearest(s,x,y,max){var best=null,bd=max||1e9;s.foes.forEach(function(f){var d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;best=f;}});return best;}
function hurtFoe(s,f,d,src){
 if(f.hp<=0)return;
 if(src!=='dot'&&s.rand()<0.15*lvl(s,'crit')){d*=2;s.fx.push({k:'crit',x:f.x,y:f.y,t:0.5});}
 f.hp-=d;f.hit=0.12;if(src!=='dot')s.fx.push({k:'num',x:f.x,y:f.y-f.r,v:Math.round(d),t:0.7});
 if(f.hp<=0){s.kills++;s.embers+=f.t==='boss'?30:(f.t==='brute'?2:1);s.fx.push({k:'boom',x:f.x,y:f.y,c:f.col,t:0.5});s.events.push('kill');}
}
function attack(s){var p=s.p;if(p.atkCd>0||s.state!=='fight')return false;
 var t=nearest(s,p.x,p.y,110);var ang=t?Math.atan2(t.y-p.y,t.x-p.x):Math.atan2(p.face,p.fx);
 p.atkAng=ang;p.atkT=0.15;p.atkCd=0.38/(1+0.12*lvl(s,'static'));
 var dmg=14*p.mult*(1+0.25*lvl(s,'fury'));
 s.foes.slice().forEach(function(f){var dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy);
  if(d<62+f.r){var a=Math.abs(((Math.atan2(dy,dx)-ang+Math.PI*3)%(Math.PI*2))-Math.PI);
   if(a<1.1||d<f.r+p.r+4){hurtFoe(s,f,dmg,'hit');if(lvl(s,'burn'))f.burn=3;
    if(lvl(s,'chain')){var c=0;s.foes.forEach(function(g){if(g!==f&&c<2&&g.hp>0&&Math.hypot(g.x-f.x,g.y-f.y)<110){c++;hurtFoe(s,g,dmg*0.4*lvl(s,'chain'),'chain');s.fx.push({k:'bolt',x:f.x,y:f.y,x2:g.x,y2:g.y,t:0.2});}});}
 }}});
 s.events.push('swing');return true;}
function dash(s,dx,dy){var p=s.p;if(p.dashCd>0||s.state!=='fight')return false;
 var m=Math.hypot(dx,dy);if(m<0.1){dx=p.fx;dy=p.face;m=Math.hypot(dx,dy)||1;}
 p.dvx=dx/m*520;p.dvy=dy/m*520;p.dashT=0.16;p.inv=0.25;p.dashCd=1.1/(1+0.35*lvl(s,'dash2'));p.zapped=[];s.events.push('dash');return true;}
function special(s){var p=s.p;if(p.spCd>0||s.state!=='fight')return false;
 var R=95*(1+0.4*lvl(s,'nova')),D=(30+20*lvl(s,'nova'))*p.mult;p.spCd=6;
 s.foes.slice().forEach(function(f){if(Math.hypot(f.x-p.x,f.y-p.y)<R+f.r){hurtFoe(s,f,D,'sp');var a=Math.atan2(f.y-p.y,f.x-p.x);if(f.t!=='boss'){f.x+=Math.cos(a)*30;f.y+=Math.sin(a)*30;}}});
 s.fx.push({k:'ring',x:p.x,y:p.y,R:R,t:0.4});s.events.push('special');return true;}
function hurtPlayer(s,d){var p=s.p;if(p.inv>0||s.state!=='fight')return;d*=1-0.15*lvl(s,'shell');p.hp-=d;s.dmgTaken+=d;p.inv=0.6;s.events.push('hurt');
 if(p.hp<=0){if(p.defy>0){p.defy--;p.hp=p.max*0.4;p.inv=1.5;s.events.push('defy');}else{p.hp=0;s.state='dead';s.events.push('dead');}}}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function step(s,dt,inp){
 s.fx.forEach(function(e){e.t-=dt;});s.fx=s.fx.filter(function(e){return e.t>0;});
 if(s.state!=='fight')return;s.t+=dt;s.rt+=dt;var p=s.p;inp=inp||{};
 ['atkCd','dashCd','spCd','inv','dashT','atkT'].forEach(function(k){if(p[k]>0)p[k]=Math.max(0,p[k]-dt);});
 var sp=150*(1+0.15*lvl(s,'swift'));
 if(p.dashT>0){p.x+=p.dvx*dt;p.y+=p.dvy*dt;
  if(lvl(s,'stormdash'))s.foes.forEach(function(f){if(p.zapped.indexOf(f)<0&&Math.hypot(f.x-p.x,f.y-p.y)<f.r+p.r+8){p.zapped.push(f);hurtFoe(s,f,14*lvl(s,'stormdash')*p.mult,'zap');}});}
 else{var mx=inp.mx||0,my=inp.my||0,m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
  p.x+=mx*sp*dt;p.y+=my*sp*dt;if(m>0.2){p.fx=mx;p.face=my;}}
 p.x=clamp(p.x,16,W-16);p.y=clamp(p.y,16,H-16);
 s.foes.forEach(function(f){
  if(f.hit>0)f.hit-=dt;
  if(f.burn>0){f.burn-=dt;hurtFoe(s,f,4*lvl(s,'burn')*dt,'dot');}
  var dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy)||1;f.cd-=dt;
  if(f.ranged){var want=f.t==='boss'?150:170;var dir=d>want+20?1:(d<want-20?-1:0);
   f.x+=dx/d*f.sp*dir*dt;f.y+=dy/d*f.sp*dir*dt;
   if(f.cd<=0){if(f.t==='boss'){var n=f.hp<f.max/2?12:8,o=s.t;for(var i=0;i<n;i++){var a=o+i*Math.PI*2/n;s.shots.push({x:f.x,y:f.y,vx:Math.cos(a)*130,vy:Math.sin(a)*130,dmg:10});}
     f.cd=f.hp<f.max/2?1.3:1.8;if(s.rand()<0.35&&s.foes.length<6)for(var k=0;k<2;k++)s.foes.push(foe(s,'grunt',f.x+(k?40:-40),f.y+30));}
    else{s.shots.push({x:f.x,y:f.y,vx:dx/d*170,vy:dy/d*170,dmg:f.dmg});f.cd=2.2;}}}
  else{f.x+=dx/d*f.sp*dt;f.y+=dy/d*f.sp*dt;
   if(d<f.r+p.r&&f.cd<=0){hurtPlayer(s,f.dmg);f.cd=0.9;}}
  f.x=clamp(f.x,10,W-10);f.y=clamp(f.y,10,H-10);
 });
 for(var i=0;i<s.foes.length;i++)for(var j=i+1;j<s.foes.length;j++){var a=s.foes[i],b=s.foes[j],ddx=b.x-a.x,ddy=b.y-a.y,dd=Math.hypot(ddx,ddy)||1,mn=a.r+b.r;
  if(dd<mn){var push=(mn-dd)/2;a.x-=ddx/dd*push;a.y-=ddy/dd*push;b.x+=ddx/dd*push;b.y+=ddy/dd*push;}}
 s.shots.forEach(function(b){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-p.x,b.y-p.y)<p.r+4){b.dead=1;hurtPlayer(s,b.dmg);}
  if(b.x<-10||b.x>W+10||b.y<-10||b.y>H+10)b.dead=1;});
 s.shots=s.shots.filter(function(b){return !b.dead;});
 s.foes=s.foes.filter(function(f){return f.hp>0;});
 if(s.state==='fight'&&s.foes.length===0)clearRoom(s);
}
function clearRoom(s){var p=s.p;s.shots=[];
 if(lvl(s,'heal'))p.hp=Math.min(p.max,p.hp+6*lvl(s,'heal'));
 s.embers+=2;s.events.push('clear');
 if(s.room>=s.rooms){s.state='won';s.events.push('won');return;}
 if(s.room%4===0){s.state='well';return;}
 s.state='boon';s.choices=rollBoons(s);}
function rollBoons(s){var keys=Object.keys(PATRONS),pat=keys[Math.floor(s.rand()*4)];
 var pool=BOONS.filter(function(b){return (b.p===pat||s.rand()<0.25)&&lvl(s,b.id)<3;});
 if(pool.length<3)pool=BOONS.filter(function(b){return lvl(s,b.id)<3;});
 var out=[];while(out.length<3&&pool.length){var i=Math.floor(s.rand()*pool.length);out.push(pool.splice(i,1)[0]);}
 return {patron:pat,list:out};}
function pickBoon(s,i){if(s.state!=='boon')return;var b=s.choices.list[i];if(!b)return;
 s.p.boons[b.id]=(s.p.boons[b.id]||0)+1;
 if(b.id==='maxhp'){s.p.max+=25;s.p.hp=Math.min(s.p.max,s.p.hp+25);}
 s.choices=null;s.state='fight';spawnRoom(s);}
function useWell(s,opt){if(s.state!=='well')return;var p=s.p;
 if(opt==='heal')p.hp=Math.min(p.max,p.hp+p.max*0.4);else{s.state='boon';s.choices=rollBoons(s);return;}
 s.state='fight';spawnRoom(s);}
function finalEmbers(s){return Math.round(s.embers*(1+0.1*(s.meta.luck||0)));}
return {newRun:newRun,step:step,attack:attack,dash:dash,special:special,pickBoon:pickBoon,useWell:useWell,
 finalEmbers:finalEmbers,PATRONS:PATRONS,BOONS:BOONS,UPG:UPG,lvl:lvl,nearest:nearest};
})();


var cv=document.getElementById('c'),cx=cv.getContext('2d'),S=null,scale=1,DPR=Math.min(2,window.devicePixelRatio||1);
var META;try{META=JSON.parse(localStorage.getItem('bd_meta')||'{}');}catch(e){META={};}
META.bank=META.bank||0;META.best=META.best||0;META.wins=META.wins||0;
function saveMeta(){try{localStorage.setItem('bd_meta',JSON.stringify(META));}catch(e){}}
function fit(){var w=innerWidth,h=innerHeight;scale=Math.min(w/360,h/560);cv.style.width=360*scale+'px';cv.style.height=560*scale+'px';cv.width=360*scale*DPR;cv.height=560*scale*DPR;}
addEventListener('resize',fit);fit();
// ---- audio ----
var AC=null,master=null,musicOn=false,beat=0,nextT=0;
function initAudio(){if(AC)return;try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,d,type,v,slide,when){if(!AC)return;var t=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
 g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}
function noise(d,v,hp){if(!AC)return;var t=AC.currentTime,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;
 var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;var g=AC.createGain();g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);}
var SFX={swing:function(){noise(0.08,0.12,2000);},kill:function(){tone(220,0.18,'sawtooth',0.08,60);},hurt:function(){tone(140,0.25,'square',0.14,50);},
 dash:function(){noise(0.15,0.08,400);tone(600,0.12,'sine',0.05,1200);},special:function(){tone(90,0.5,'sawtooth',0.2,40);noise(0.4,0.15,200);},
 clear:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,'triangle',0.08,0,AC.currentTime+i*0.08);});},
 boss:function(){tone(55,1.2,'sawtooth',0.2,40);},defy:function(){[880,660,990].forEach(function(f,i){tone(f,0.3,'sine',0.1,0,AC.currentTime+i*0.1);});},
 dead:function(){tone(300,1.2,'sawtooth',0.15,40);},won:function(){[392,523,659,784,1046,1318].forEach(function(f,i){tone(f,0.4,'triangle',0.1,0,AC.currentTime+i*0.12);});}};
var SCALE=[0,3,5,7,10,12];
function music(){if(!AC||!musicOn)return;var bpm=S&&S.foes.some(function(f){return f.t==='boss';})?150:124,sp=60/bpm/2;
 while(nextT<AC.currentTime+0.2){var b=beat%16,root=b<8?110:98;
  if(b%4===0)tone(55,0.25,'sine',0.25,35,nextT);
  if(b%2===1)tone(root*2,0.12,'sawtooth',0.035,0,nextT);
  if(Math.random()<0.45)tone(root*4*Math.pow(2,SCALE[(beat*7)%6]/12),0.18,'triangle',0.03,0,nextT);
  beat++;nextT+=sp;}}
setInterval(music,60);

// ---- input ----
var joy={id:null,ox:0,oy:0,x:0,y:0},keys={},shake=0,paused=false;
function inBtn(t){return t.target&&t.target.closest&&t.target.closest('.btn,button,.card');}
cv.addEventListener('touchstart',function(e){initAudio();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
 if(joy.id===null&&t.clientX<innerWidth*0.6){joy.id=t.identifier;joy.ox=joy.x=t.clientX;joy.oy=joy.y=t.clientY;}}e.preventDefault();},{passive:false});
addEventListener('touchmove',function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joy.id){joy.x=t.clientX;joy.y=t.clientY;}}},{passive:false});
function endT(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===joy.id)joy.id=null;}
addEventListener('touchend',endT);addEventListener('touchcancel',endT);
var mouseJ=false;cv.addEventListener('mousedown',function(e){initAudio();mouseJ=true;joy.id='m';joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;});
addEventListener('mousemove',function(e){if(mouseJ){joy.x=e.clientX;joy.y=e.clientY;}});addEventListener('mouseup',function(){if(mouseJ){mouseJ=false;joy.id=null;}});
function vec(){var mx=0,my=0;if(joy.id!==null){var dx=joy.x-joy.ox,dy=joy.y-joy.oy,m=Math.hypot(dx,dy),R=50;if(m>4){mx=dx/R;my=dy/R;var mm=Math.hypot(mx,my);if(mm>1){mx/=mm;my/=mm;}}}
 if(keys.a||keys.arrowleft)mx=-1;if(keys.d||keys.arrowright)mx=1;if(keys.w||keys.arrowup)my=-1;if(keys.s||keys.arrowdown)my=1;return {mx:mx,my:my};}
addEventListener('keydown',function(e){initAudio();var k=e.key.toLowerCase();keys[k]=1;if(!S)return;
 if(k===' '||k==='j')act('A');if(k==='shift'||k==='k')act('D');if(k==='l'||k==='e')act('S');if(k==='p'||k==='escape')togglePause();
 if(S.state==='boon'&&'123'.indexOf(k)>=0&&k)choose(+k-1);});
addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0;});
function act(b){if(!S||paused)return;initAudio();var v=vec();
 if(b==='A')BD.attack(S);if(b==='D')BD.dash(S,v.mx,v.my);if(b==='S'&&BD.special(S))shake=10;}
var held={};['A','D','S'].forEach(function(b){var el=document.getElementById('b'+b);
 el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();held[b]=1;act(b);if(navigator.vibrate)navigator.vibrate(8);},{passive:false});
 el.addEventListener('touchend',function(e){e.preventDefault();held[b]=0;});el.addEventListener('touchcancel',function(){held[b]=0;});
 el.addEventListener('mousedown',function(e){e.stopPropagation();held[b]=1;act(b);});el.addEventListener('mouseup',function(){held[b]=0;});});
document.getElementById('pause').onclick=togglePause;
function togglePause(){if(!S||S.state!=='fight')return;paused=!paused;if(paused)showPause();else hide('pick');}

// ---- render ----
var stars=[];for(var i=0;i<60;i++)stars.push({x:Math.random()*360,y:Math.random()*560,r:Math.random()*1.6+0.3,p:Math.random()*6});
var parts=[];
function burst(x,y,c,n,sp){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=(Math.random()*0.8+0.2)*(sp||160);parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0.6,c:c});}}
var ROOMCOL=['#3b1d5e','#1d3b5e','#5e1d3b','#1d5e4b'];
function draw(dt,now){var c=cx;c.setTransform(scale*DPR,0,0,scale*DPR,0,0);
 var sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;shake=Math.max(0,shake-dt*40);c.translate(sx,sy);
 var tint=ROOMCOL[(S?S.room:0)%4];var g=c.createRadialGradient(180,280,40,180,280,420);g.addColorStop(0,tint);g.addColorStop(1,'#07030f');c.fillStyle=g;c.fillRect(-20,-20,400,600);
 // floor tiles
 c.strokeStyle='rgba(255,120,200,0.08)';c.lineWidth=1;for(var x=0;x<=360;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,560);c.stroke();}for(var y=0;y<=560;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(360,y);c.stroke();}
 stars.forEach(function(s){c.globalAlpha=0.3+0.3*Math.sin(now/600+s.p);c.fillStyle='#ffd6f0';c.fillRect(s.x,s.y,s.r,s.r);});c.globalAlpha=1;
 // braziers
 [[20,20],[340,20],[20,540],[340,540]].forEach(function(b){var fl=6+Math.sin(now/90+b[0])*2;c.shadowBlur=24;c.shadowColor='#ff7a3d';c.fillStyle='#ffb35f';c.beginPath();c.arc(b[0],b[1],fl,0,6.28);c.fill();});c.shadowBlur=0;
 if(!S)return;var p=S.p;
 c.globalCompositeOperation='lighter';
 S.shots.forEach(function(b){c.fillStyle='#ffd23f';c.shadowBlur=12;c.shadowColor='#ff9a2f';c.beginPath();c.arc(b.x,b.y,4.5,0,6.28);c.fill();});
 c.shadowBlur=0;c.globalCompositeOperation='source-over';
 S.foes.forEach(function(f){c.save();c.translate(f.x,f.y);c.shadowBlur=18;c.shadowColor=f.col;
  c.fillStyle=f.hit>0?'#fff':f.col;var bob=Math.sin(now/200+f.x)*2;
  if(f.t==='boss'){c.rotate(now/900);for(var k=0;k<6;k++){c.rotate(1.047);c.fillRect(f.r-4,-5,14,10);}c.rotate(-now/900);}
  c.beginPath();if(f.t==='wisp'){c.arc(0,bob,f.r,0,6.28);}else if(f.t==='brute'){c.rect(-f.r,-f.r+bob,f.r*2,f.r*2);}else if(f.t==='archer'){c.moveTo(0,-f.r+bob);c.lineTo(f.r,f.r+bob);c.lineTo(-f.r,f.r+bob);c.closePath();}else c.arc(0,bob,f.r,0,6.28);c.fill();
  c.shadowBlur=0;c.fillStyle='#0a0614';c.fillRect(-f.r*0.5,-3+bob,3,3);c.fillRect(f.r*0.5-3,-3+bob,3,3);
  if(f.burn>0){c.fillStyle='rgba(255,122,61,0.6)';c.beginPath();c.arc(0,-f.r-4+Math.sin(now/50)*2,4,0,6.28);c.fill();}
  c.restore();
  if(f.hp<f.max&&f.t!=='boss'){c.fillStyle='#000a';c.fillRect(f.x-14,f.y-f.r-9,28,4);c.fillStyle=f.col;c.fillRect(f.x-14,f.y-f.r-9,28*Math.max(0,f.hp/f.max),4);}});
 var boss=S.foes.find(function(f){return f.t==='boss';});if(boss){c.fillStyle='#000a';c.fillRect(30,60,300,10);c.fillStyle='#ff2e88';c.fillRect(30,60,300*boss.hp/boss.max,10);c.fillStyle='#fff';c.font='bold 12px system-ui';c.textAlign='center';c.fillText('THE HOLLOW WARDEN',180,54);}

 // player
 var blink=p.inv>0&&Math.floor(now/60)%2;
 if(p.dashT>0){for(var k=1;k<5;k++){c.globalAlpha=0.15*(5-k);c.fillStyle='#e7a8ff';c.beginPath();c.arc(p.x-p.dvx*0.012*k,p.y-p.dvy*0.012*k,p.r,0,6.28);c.fill();}c.globalAlpha=1;}
 if(!blink){c.save();c.translate(p.x,p.y);c.shadowBlur=22;c.shadowColor='#7fd8ff';
  c.fillStyle='#e9f6ff';c.beginPath();c.arc(0,0,p.r,0,6.28);c.fill();
  c.fillStyle='#ff2e88';c.beginPath();c.arc(0,0,p.r*0.55,0,6.28);c.fill();
  var a=Math.atan2(p.face,p.fx);c.rotate(a);c.fillStyle='#ffd23f';c.fillRect(p.r-2,-3,8,6);c.restore();}
 if(p.atkT>0){c.save();c.translate(p.x,p.y);c.rotate(p.atkAng);c.globalCompositeOperation='lighter';
  var pr=1-p.atkT/0.15;c.strokeStyle='rgba(255,180,255,'+(1-pr)+')';c.lineWidth=8;c.shadowBlur=20;c.shadowColor='#ff5fa2';
  c.beginPath();c.arc(0,0,50,-1.1+pr*0.4,1.1+pr*0.4);c.stroke();c.restore();}
 c.globalCompositeOperation='lighter';
 S.fx.forEach(function(e){
  if(e.k==='ring'){c.strokeStyle='rgba(255,154,95,'+e.t*2.5+')';c.lineWidth=10*e.t;c.beginPath();c.arc(e.x,e.y,e.R*(1.2-e.t),0,6.28);c.stroke();}
  else if(e.k==='bolt'){c.strokeStyle='#bfefff';c.lineWidth=2;c.shadowBlur=12;c.shadowColor='#7fd8ff';c.beginPath();c.moveTo(e.x,e.y);var mx=(e.x+e.x2)/2+(Math.random()-0.5)*20,my=(e.y+e.y2)/2+(Math.random()-0.5)*20;c.lineTo(mx,my);c.lineTo(e.x2,e.y2);c.stroke();c.shadowBlur=0;}
  else if(e.k==='boom'&&!e.done){e.done=1;burst(e.x,e.y,e.c,14);}
 });
 parts.forEach(function(q){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.94;q.vy*=0.94;c.globalAlpha=Math.max(0,q.t/0.6);c.fillStyle=q.c;c.fillRect(q.x-2,q.y-2,4,4);});
 parts=parts.filter(function(q){return q.t>0;});c.globalAlpha=1;c.globalCompositeOperation='source-over';
 c.textAlign='center';S.fx.forEach(function(e){if(e.k==='num'){c.globalAlpha=Math.min(1,e.t*2);c.fillStyle='#fff';c.font='bold 13px system-ui';c.fillText(e.v,e.x,e.y-(0.7-e.t)*30);}if(e.k==='crit'){c.fillStyle='#ffd23f';c.font='bold 14px system-ui';c.fillText('CRIT!',e.x,e.y-26);}});c.globalAlpha=1;
 // joystick
 if(joy.id!==null&&joy.id!=='m'){var r=cv.getBoundingClientRect(),ox=(joy.ox-r.left)/scale,oy=(joy.oy-r.top)/scale,v=vec();
  c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=2;c.beginPath();c.arc(ox,oy,40,0,6.28);c.stroke();c.fillStyle='rgba(255,95,162,0.5)';c.beginPath();c.arc(ox+v.mx*40,oy+v.my*40,18,0,6.28);c.fill();}
 if(S.room===1&&S.rt<6&&!META.wins){c.globalAlpha=Math.min(1,(6-S.rt)/2);c.fillStyle='#fff';c.font='bold 14px system-ui';c.textAlign='center';c.fillText('Drag left side to move',180,330);c.fillText('Hold STRIKE to auto-aim attacks',180,352);c.fillText('DASH through danger',180,374);c.globalAlpha=1;}
 if(S.rt<1.2){c.globalAlpha=1.2-S.rt;c.fillStyle='#ffb35f';c.font='bold 28px system-ui';c.textAlign='center';c.fillText(S.room===12?'THE WARDEN':'CHAMBER '+S.room,180,260);c.globalAlpha=1;}
 if(p.hp<p.max*0.3){c.fillStyle='rgba(255,0,60,'+(0.12+0.08*Math.sin(now/150))+')';c.fillRect(0,0,360,560);}
}

// ---- UI ----
function $(i){return document.getElementById(i);}
function show(i,h){$(i).innerHTML=h;$(i).classList.add('on');}
function hide(i){$(i).classList.remove('on');}
function menu(){S=null;musicOn=false;var u='';Object.keys(BD.UPG).forEach(function(k){var U=BD.UPG[k],l=META[k]||0,cost=l<U.max?U.cost[l]:null;
  u+='<button class="card" style="border-color:#ffb35f" data-u="'+k+'"><b>'+U.n+' '+'&#9670;'.repeat(l)+'&#9671;'.repeat(U.max-l)+'</b>'+U.d+'<br><span class="muted">'+(cost===null?'Maxed':cost+' embers')+'</span></button>';});
 show('menu','<h1>BOON DEPTHS</h1><div class="muted">Fight up through 12 chambers. Take gifts from 4 patrons. Defeat the Hollow Warden.</div><br>'+
  '<button class="big" id="go">'+(META.runs?'DESCEND AGAIN':'DESCEND')+'</button>'+
  '<div style="margin:10px 0">Embers: <b style="color:#ffb35f">'+META.bank+'</b> &nbsp; Best chamber: <b>'+META.best+'</b> &nbsp; Escapes: <b>'+META.wins+'</b></div>'+
  '<h2>Mirror of Embers</h2>'+u+'<div class="muted" style="margin-top:10px">Move: drag left side / WASD. Strike: J or Space. Dash: K or Shift. Flare: L.</div>');
 $('go').onclick=start;
 Array.prototype.forEach.call(document.querySelectorAll('[data-u]'),function(b){b.onclick=function(){var k=b.dataset.u,U=BD.UPG[k],l=META[k]||0;
  if(l<U.max&&META.bank>=U.cost[l]){META.bank-=U.cost[l];META[k]=l+1;saveMeta();tone(660,0.2,'triangle',0.1);menu();}else tone(120,0.2,'square',0.08);};});}
function start(){initAudio();if(AC&&AC.resume)AC.resume();hide('menu');hide('pick');paused=false;
 S=BD.newRun({vit:META.vit,might:META.might,grace:META.grace,luck:META.luck});META.runs=(META.runs||0)+1;saveMeta();musicOn=true;if(AC)nextT=AC.currentTime;}
function choose(i){if(!S||S.state!=='boon')return;BD.pickBoon(S,i);hide('pick');SFX.clear&&AC&&tone(880,0.2,'triangle',0.1);}
function showBoons(){var ch=S.choices,P=BD.PATRONS[ch.patron],h='<h2 style="color:'+P.col+'">'+P.name+' offers a gift</h2>';
 ch.list.forEach(function(b,i){var pc=BD.PATRONS[b.p].col,l=BD.lvl(S,b.id);h+='<button class="card" style="border-color:'+pc+';box-shadow:0 0 16px '+pc+'55" data-b="'+i+'"><b style="color:'+pc+'">'+b.n+(l?' (Lv '+(l+1)+')':'')+'</b>'+b.d+'</button>';});
 show('pick',h);Array.prototype.forEach.call(document.querySelectorAll('[data-b]'),function(b){b.onclick=function(){choose(+b.dataset.b);};});}
function showWell(){show('pick','<h2>A Spring of Rest</h2><div class="muted">Chamber '+S.room+' cleared. Choose one.</div><br><button class="big" id="wh">Heal 40% HP</button><button class="big" id="wb">Take an extra gift</button>');
 $('wh').onclick=function(){BD.useWell(S,'heal');hide('pick');tone(520,0.4,'sine',0.1);};$('wb').onclick=function(){BD.useWell(S,'boon');showBoons();};}
function showPause(){var b=Object.keys(S.p.boons).map(function(k){var x=BD.BOONS.find(function(q){return q.id===k;});return x.n+' Lv'+S.p.boons[k];}).join('<br>')||'No gifts yet';
 show('pick','<h2>Paused</h2><div class="muted">'+b+'</div><br><button class="big" id="res">Resume</button><button class="big" id="quit">Give up run</button>');
 $('res').onclick=togglePause;$('quit').onclick=function(){paused=false;S.state='dead';hide('pick');};}
function endRun(won){musicOn=false;var e=BD.finalEmbers(S);META.bank+=e;META.best=Math.max(META.best,S.room-(won?0:1));if(won)META.wins++;saveMeta();
 show('pick','<h1>'+(won?'ESCAPED!':'FALLEN')+'</h1><div>'+(won?'The Hollow Warden is broken.':'You fell in chamber '+S.room+' of 12.')+'</div><br><div>Foes slain: <b>'+S.kills+'</b><br>Embers earned: <b style="color:#ffb35f">+'+e+'</b></div><br><button class="big" id="again">Back to the Mirror</button>');
 $('again').onclick=function(){hide('pick');menu();};}

// ---- loop ----
var last=performance.now(),ended=false,lastState='';
function hud(){if(!S){$('hud').style.visibility='hidden';['bA','bD','bS'].forEach(function(b){$(b).style.display='none';});return;}
 $('hud').style.visibility='visible';['bA','bD','bS'].forEach(function(b){$(b).style.display='flex';});var p=S.p;
 $('hp').style.width=(100*p.hp/p.max)+'%';$('hpt').textContent=Math.ceil(p.hp)+(p.defy?' \u2665'+p.defy:'');$('rm').textContent='Ch '+S.room+'/12';$('em').textContent='\u2737'+S.embers;
 $('cdD').style.transform='scaleY('+(p.dashCd/(1.1/(1+0.35*BD.lvl(S,'dash2'))))+')';$('cdS').style.transform='scaleY('+p.spCd/6+')';$('cdA').style.transform='scaleY('+Math.min(1,p.atkCd/0.38)+')';}
function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;
 if(S&&!paused){if(held.A)BD.attack(S);BD.step(S,dt,vec());
  S.events.forEach(function(e){if(AC&&SFX[e])SFX[e]();if(e==='hurt'){shake=8;if(navigator.vibrate)navigator.vibrate(30);}if(e==='kill')shake=Math.max(shake,3);});S.events.length=0;
  if(S.state!==lastState){lastState=S.state;if(S.state==='boon')showBoons();else if(S.state==='well')showWell();else if(S.state==='dead'||S.state==='won')setTimeout(function(){endRun(S.state==='won');},700);}}
 if(!S)lastState='';
 try{draw(dt,now);}catch(err){}hud();requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',function(){if(document.hidden&&S&&S.state==='fight'&&!paused)togglePause();});
menu();requestAnimationFrame(frame);
</script></body></html>
