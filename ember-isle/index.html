<style>

<canvas id="c"></canvas>
<div id="ui" class="ov"><h1>EMBER ISLE</h1><h2 id="sub"></h2>
<p id="msg">Shipwrecked on a wild island. Chop, mine and craft by day. When night falls, the shades come for you. Keep your fire burning and survive 10 nights.<br><small>Left thumb: move &middot; Big button: chop / mine / fight</small></p>
<button class="btn" id="play">BEGIN</button>
<button class="btn alt" id="mute">Sound: ON</button>
<div id="stats"></div></div>
<div id="craft" class="ov hide"><h2>Craft &amp; Build</h2><div id="grid"></div><button class="btn alt" id="close">Close</button></div>
<script>
// ===== Ember Isle core (no DOM) =====
const W=2400,CX=1200,CY=1200,ISR=1080,CYCLE=150,NIGHT_AT=100,LAST_NIGHT=10;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R={
 axe:{n:'Stone Axe',c:{wood:5,stone:3},d:'Chop trees 2.5x faster',tool:1},
 pick:{n:'Pickaxe',c:{wood:5,stone:4},d:'Mine fast, unlocks iron',tool:1},
 spear:{n:'Spear',c:{wood:6,stone:4},d:'Attack 2 to 5',tool:1},
 fire:{n:'Campfire',c:{wood:6,stone:3},d:'Light, warmth, burns shades',b:1},
 wall:{n:'Wood Wall',c:{wood:4},d:'Blocks shades (60 HP)',b:1},
 swall:{n:'Stone Wall',c:{stone:5},d:'Tough wall (160 HP)',b:1},
 torch:{n:'Torch',c:{wood:3,stone:1},d:'Carry light for one night'},
 blade:{n:'Iron Blade',c:{iron:3,wood:4},d:'Attack 11 (needs Spear)',tool:1,req:'spear'},
 armor:{n:'Ember Armor',c:{iron:4,ember:5},d:'Take 45% less damage',tool:1},
 brazier:{n:'Ember Brazier',c:{iron:3,stone:6,ember:4},d:'Big fire that never goes out',b:1}
};
function newWorld(seed){
 const r=rng(seed||((Math.random()*1e9)|0));
 const w={r,t:0,day:1,nodes:[],builds:[],mobs:[],crit:[],fx:[],txt:[],over:0,won:0,shake:0,spawnT:0,
  stat:{kills:0,crafted:0,gathered:0},
  p:{x:CX,y:CY,hp:100,food:100,warm:100,fx:1,fy:0,cd:0,hurt:0,swing:0,inv:{wood:0,stone:0,iron:0,berry:3,meat:0,ember:0},tools:{},torch:0}};
 const ok=(x,y,m)=>{const d=Math.hypot(x-CX,y-CY);if(d>ISR-60||d<110)return 0;for(const n of w.nodes)if(Math.hypot(n.x-x,n.y-y)<m)return 0;return 1};
 const add=(type,cnt,m,a0,a1)=>{let k=0,tr=0;while(k<cnt&&tr++<cnt*60){const a=r()*6.283,d=a0+r()*(a1-a0),x=CX+Math.cos(a)*d,y=CY+Math.sin(a)*d;if(ok(x,y,m)){w.nodes.push(mkNode(type,x,y,r));k++}}};
 add('tree',230,46,120,1020);add('rock',110,52,160,1020);add('bush',60,46,130,950);add('iron',26,60,620,1000);
 for(let i=0;i<14;i++)spawnCrit(w);
 return w}
function mkNode(type,x,y,r){const hp={tree:5,rock:6,bush:1,iron:9}[type];return{type,x,y,hp,mx:hp,rad:{tree:20,rock:24,bush:15,iron:24}[type],dead:0,re:0,ph:r()*6.28,sz:.8+r()*.45,ripe:1}}
function spawnCrit(w){const a=w.r()*6.283,d=200+w.r()*800;w.crit.push({x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,hp:3,vx:0,vy:0,t:0})}
function phase(w){const c=w.t%CYCLE;return c<NIGHT_AT-10?'day':c<NIGHT_AT?'dusk':c<CYCLE-6?'night':'dawn'}
function darkness(w){const c=w.t%CYCLE;if(c<NIGHT_AT-10)return 0;if(c<NIGHT_AT)return(c-(NIGHT_AT-10))/10*.88;if(c<CYCLE-6)return .88;return .88*(CYCLE-c)/6}
function canCraft(w,id){const rc=R[id],inv=w.p.inv;if(rc.tool&&w.p.tools[id])return 0;if(id==='torch'&&w.p.torch>0)return 0;if(rc.req&&!w.p.tools[rc.req])return 0;for(const k in rc.c)if((inv[k]||0)<rc.c[k])return 0;return 1}
function craft(w,id){if(!canCraft(w,id))return 0;const rc=R[id],p=w.p;for(const k in rc.c)p.inv[k]-=rc.c[k];w.stat.crafted++;
 if(rc.tool)p.tools[id]=1;else if(id==='torch')p.torch=1;
 else{let x=p.x+p.fx*50,y=p.y+p.fy*50;const dc=Math.hypot(x-CX,y-CY);if(dc>ISR-40){x=CX+(x-CX)/dc*(ISR-40);y=CY+(y-CY)/dc*(ISR-40)}
  const b={type:id,x,y,hp:id==='wall'?60:id==='swall'?160:80,mx:id==='wall'?60:id==='swall'?160:80,fuel:id==='fire'?70:1e9,rad:id.includes('wall')?22:18};
  b.mx=b.hp;w.builds.push(b);
  // push player out of the new structure
  const d=Math.hypot(p.x-x,p.y-y)||1;if(d<b.rad+16){p.x=x+(p.x-x)/d*(b.rad+17);p.y=y+(p.y-y)/d*(b.rad+17)}}
 burst(w,p.x,p.y,'#ffd27a',14);say(w,p.x,p.y-30,rc.n+'!','#ffe9a8');ev(w,'craft');return 1}
function lightR(b){return b.type==='brazier'?240:b.type==='fire'?(b.fuel>0?90+Math.min(70,b.fuel*1.2):0):0}
function inLight(w,x,y){for(const b of w.builds){const L=lightR(b);if(L&&Math.hypot(b.x-x,b.y-y)<L)return b}return null}
function burst(w,x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(sp||90)*(.3+Math.random());w.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c})}}
function say(w,x,y,s,c){w.txt.push({x,y,s,c,l:1.2})}
function ev(w,e){(w.evs=w.evs||[]).push(e)}
function solid(w,x,y,r,isMob){
 for(const n of w.nodes){if(n.dead||n.type==='bush')continue;const dx=x-n.x,dy=y-n.y,d=Math.hypot(dx,dy),m=n.rad+r;if(d<m&&d>0){x=n.x+dx/d*m;y=n.y+dy/d*m}}
 for(const b of w.builds){const dx=x-b.x,dy=y-b.y,d=Math.hypot(dx,dy),m=b.rad+r;if(d<m&&d>0){x=b.x+dx/d*m;y=b.y+dy/d*m}}
 const d=Math.hypot(x-CX,y-CY);if(d>ISR-20){x=CX+(x-CX)/d*(ISR-20);y=CY+(y-CY)/d*(ISR-20)}
 return[x,y]}
function atk(w){const p=w.p;return p.tools.blade?11:p.tools.spear?5:2}
// find best target in front/around for ACT
function target(w){const p=w.p;let best=null,bs=1e9;
 const cons=(o,kind,rr)=>{const d=Math.hypot(o.x-p.x,o.y-p.y)-(o.rad||12);if(d>rr)return;const dot=((o.x-p.x)*p.fx+(o.y-p.y)*p.fy)/(d+30);const s=d-dot*25+(kind==='mob'?-40:0);if(s<bs){bs=s;best={o,kind}}};
 for(const m of w.mobs)if(m.hp>0)cons(m,'mob',58);
 for(const c of w.crit)cons(c,'crit',50);
 for(const n of w.nodes)if(!n.dead&&!(n.type==='bush'&&!n.ripe))cons(n,'node',44);
 if(p.inv.wood>0)for(const b of w.builds)if(b.type==='fire'&&b.fuel<160)cons(b,'fuel',46);
 return best}
function act(w){const p=w.p;if(p.cd>0||w.over)return 0;const t=target(w);p.cd=.42;p.swing=.22;if(!t){ev(w,'whiff');return 0}
 const o=t.o;const a=Math.atan2(o.y-p.y,o.x-p.x);p.fx=Math.cos(a);p.fy=Math.sin(a);
 if(t.kind==='mob'){o.hp-=atk(w);o.kx=Math.cos(a)*160;o.ky=Math.sin(a)*160;o.flash=.12;burst(w,o.x,o.y,'#b07cff',8);ev(w,'hit');
  if(o.hp<=0)killMob(w,o)}
 else if(t.kind==='crit'){o.hp-=atk(w);burst(w,o.x,o.y,'#fff',5);ev(w,'hit');if(o.hp<=0){w.crit.splice(w.crit.indexOf(o),1);p.inv.meat++;say(w,o.x,o.y,'+1 meat','#ffb0a0')}}
 else if(t.kind==='fuel'){p.inv.wood--;o.fuel=Math.min(180,o.fuel+30);burst(w,o.x,o.y,'#ffb347',12,120);say(w,o.x,o.y-20,'+30s fire','#ffcf6a');ev(w,'fuel')}
 else{const n=o;if(n.type==='bush'){n.ripe=0;n.re=45;p.inv.berry+=2;say(w,n.x,n.y-14,'+2 berries','#ff7aa8');burst(w,n.x,n.y,'#ff4f8b',7);ev(w,'pick');w.stat.gathered+=2;return 1}
  if(n.type==='iron'&&!p.tools.pick){say(w,n.x,n.y-20,'Need Pickaxe','#ff8a8a');ev(w,'whiff');return 0}
  const dmg=n.type==='tree'?(p.tools.axe?2.5:1):(p.tools.pick?2.5:1);n.hp-=dmg;n.shk=.2;
  burst(w,n.x,n.y,n.type==='tree'?'#7bdc6a':n.type==='iron'?'#ff9a5a':'#c9c9d6',5);ev(w,n.type==='tree'?'chop':'mine');
  if(n.hp<=0){n.dead=1;n.re=n.type==='iron'?150:80;const k=n.type==='tree'?'wood':n.type==='rock'?'stone':'iron',q=n.type==='iron'?2:3;p.inv[k]+=q;w.stat.gathered+=q;
   say(w,n.x,n.y-20,'+'+q+' '+k,k==='wood'?'#ffd28a':k==='iron'?'#ffae6a':'#e0e0ff');burst(w,n.x,n.y,'#ffe8b0',14,140);ev(w,'break')}}
 return 1}
function killMob(w,m){m.hp=0;w.stat.kills++;const q=m.big?3:1;w.p.inv.ember+=q;say(w,m.x,m.y,'+'+q+' ember','#ffcf5a');burst(w,m.x,m.y,'#c49bff',22,160);ev(w,'kill')}
function eat(w){const p=w.p;if(w.over)return 0;const fire=inLight(w,p.x,p.y);
 if(p.inv.meat>0){p.inv.meat--;const v=fire?40:12;p.food=Math.min(100,p.food+v);if(fire)p.hp=Math.min(100,p.hp+10);say(w,p.x,p.y-30,fire?'Cooked meat +40':'Raw meat +12','#ffb0a0')}
 else if(p.inv.berry>0){p.inv.berry--;p.food=Math.min(100,p.food+14);p.hp=Math.min(100,p.hp+2);say(w,p.x,p.y-30,'Berries +14','#ff7aa8')}
 else{say(w,p.x,p.y-30,'No food!','#ff8a8a');return 0}
 ev(w,'eat');return 1}
function spawnMob(w){const p=w.p,n=w.day;const a=w.r()*6.283,d=480+w.r()*200;let x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;const dd=Math.hypot(x-CX,y-CY);if(dd>ISR-30){x=CX+(x-CX)/dd*(ISR-30);y=CY+(y-CY)/dd*(ISR-30)}
 const big=n>=4&&w.r()<.12+n*.02;w.mobs.push({x,y,hp:big?30+n*6:5+n*1.6,mx:big?30+n*6:5+n*1.6,sp:big?52+n*2:66+n*3.2,dmg:big?18:4+n*.8,big,cd:0,kx:0,ky:0,ph:w.r()*6})}
function step(w,dt,mvx,mvy){if(w.over)return;const p=w.p,ph0=phase(w);w.t+=dt;const ph=phase(w);
 const nd=Math.floor(w.t/CYCLE)+1;if(nd!==w.day){w.day=nd;ev(w,'dawn');say(w,p.x,p.y-50,'Dawn of day '+nd,'#fff2b0');
  for(const m of w.mobs){if(m.hp>0)burst(w,m.x,m.y,'#9d7cff',10)}w.mobs=[];p.torch=0;
  if(nd>LAST_NIGHT){w.over=1;w.won=1;ev(w,'win');return}}
 if(ph==='night'&&ph0!=='night')ev(w,'night');
 // move
 const ml=Math.hypot(mvx,mvy);const sp=165*(p.food<15?.75:1);
 if(ml>.05){const k=Math.min(1,ml);p.fx=mvx/ml;p.fy=mvy/ml;let nx=p.x+p.fx*sp*k*dt,ny=p.y+p.fy*sp*k*dt;[p.x,p.y]=solid(w,nx,ny,15);p.walk=(p.walk||0)+dt*k}
 p.cd-=dt;p.swing-=dt;p.hurt-=dt;
 // survival stats
 const fire=inLight(w,p.x,p.y),dk=darkness(w);
 p.food=Math.max(0,p.food-dt*.42);
 if(fire)p.warm=Math.min(100,p.warm+dt*14);else if(dk>.5)p.warm=Math.max(0,p.warm-dt*(p.torch?.55:1.25));else p.warm=Math.min(100,p.warm+dt*3);
 if(p.food<=0)hurt(w,dt*1.6,1);if(p.warm<=0)hurt(w,dt*2.2,1);
 if(p.food>60&&p.warm>40&&p.hp<100)p.hp=Math.min(100,p.hp+dt*(fire?1.6:.6));
 // nodes regrow
 for(const n of w.nodes){if(n.dead){n.re-=dt;if(n.re<=0&&Math.hypot(n.x-p.x,n.y-p.y)>80){n.dead=0;n.hp=n.mx}}else if(!n.ripe){n.re-=dt;if(n.re<=0)n.ripe=1}if(n.shk)n.shk=Math.max(0,n.shk-dt)}
 // fires burn fuel
 for(let i=w.builds.length-1;i>=0;i--){const b=w.builds[i];if(b.type==='fire')b.fuel=Math.max(0,b.fuel-dt*(dk>.5?1:.6));if(b.hp<=0){burst(w,b.x,b.y,'#a07040',18,150);w.builds.splice(i,1);ev(w,'break')}}
 // critters
 if(w.crit.length<14&&w.r()<dt*.15)spawnCrit(w);
 for(const c of w.crit){c.t-=dt;const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<150){const a=Math.atan2(c.y-p.y,c.x-p.x);c.vx=Math.cos(a)*120;c.vy=Math.sin(a)*120;c.t=.4}else if(c.t<=0){const a=w.r()*6.283;c.vx=Math.cos(a)*40;c.vy=Math.sin(a)*40;c.t=1+w.r()*2}
  [c.x,c.y]=solid(w,c.x+c.vx*dt,c.y+c.vy*dt,9)}
 // night spawns
 if(ph==='night'){const want=2+w.day*2.6;w.spawnT-=dt;const alive=w.mobs.filter(m=>m.hp>0).length;if(w.spawnT<=0&&alive<want){spawnMob(w);w.spawnT=Math.max(.7,4.2-w.day*.32)}}
 // mobs
 for(const m of w.mobs){if(m.hp<=0)continue;m.cd-=dt;m.flash=Math.max(0,(m.flash||0)-dt);m.ph+=dt*4;
  const L=inLight(w,m.x,m.y);if(L){m.hp-=dt*(L.type==='brazier'?14:8);if(Math.random()<dt*8)burst(w,m.x,m.y,'#ffb347',2,40);if(m.hp<=0){killMob(w,m);continue}}
  let tx=p.x,ty=p.y;const dp=Math.hypot(tx-m.x,ty-m.y);
  // shades fear light unless player is hiding in it: they circle the edge; brutes walk in
  let ax=(tx-m.x)/dp,ay=(ty-m.y)/dp;
  if(!m.big){for(const b of w.builds){const lr=lightR(b);if(!lr)continue;const dx=m.x-b.x,dy=m.y-b.y,d=Math.hypot(dx,dy);if(d<lr+40){const s=(lr+40-d)/40*1.4;ax+=dx/d*s;ay+=dy/d*s}}}
  const al=Math.hypot(ax,ay)||1;const ox=m.x,oy=m.y;
  let nx=m.x+(ax/al*m.sp+m.kx)*dt,ny=m.y+(ay/al*m.sp+m.ky)*dt;m.kx*=.86;m.ky*=.86;
  // wall attack: if blocked by a wall, hit it
  let blocker=null;for(const b of w.builds){if(Math.hypot(nx-b.x,ny-b.y)<b.rad+14)blocker=b}
  [m.x,m.y]=solid(w,nx,ny,13,1);
  if(blocker&&Math.hypot(m.x-ox,m.y-oy)<m.sp*dt*.35&&m.cd<=0){blocker.hp-=m.dmg*(m.big?2:1);m.cd=1;blocker.flash=.15;burst(w,blocker.x,blocker.y,'#d9a066',6);ev(w,'thud')}
  if(dp<30&&m.cd<=0){m.cd=1;hurt(w,m.dmg);m.kx=-ax/al*120;m.ky=-ay/al*120}}
 w.mobs=w.mobs.filter(m=>m.hp>0);
 // fx
 for(const f of w.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;f.l-=dt}w.fx=w.fx.filter(f=>f.l>0);if(w.fx.length>500)w.fx.splice(0,w.fx.length-500);
 for(const t of w.txt){t.y-=dt*30;t.l-=dt}w.txt=w.txt.filter(t=>t.l>0);w.shake=Math.max(0,w.shake-dt*30)}
function hurt(w,a,env){const p=w.p;if(p.tools.armor&&!env)a*=.55;p.hp-=a;if(!env){p.hurt=.3;w.shake=8;burst(w,p.x,p.y,'#ff4060',10);ev(w,'ouch')}
 if(p.hp<=0){p.hp=0;w.over=1;ev(w,'die')}}
function nightsSurvived(w){return w.won?LAST_NIGHT:Math.max(0,w.day-1)}
// ===== Ember Isle client =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let VW=0,VH=0,DPR=1,Z=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;Z=Math.max(.75,Math.min(1.5,Math.min(VW,VH)/560));layoutButtons()}
addEventListener('resize',resize);
let world=null,state='menu',muted=false,last=0,hintT=0,shown={};
const save=JSON.parse(localStorage.getItem('emberisle')||'{"best":0,"wins":0,"runs":0}');
// ---- ground prerender (half resolution) ----
let ground=null;
function buildGround(){const g=document.createElement('canvas');g.width=1200;g.height=1200;const c=g.getContext('2d');
 c.fillStyle='#0b3a5a';c.fillRect(0,0,1200,1200);
 const s=.5;const rg=c.createRadialGradient(600,600,ISR*s*.2,600,600,ISR*s+40);rg.addColorStop(0,'#3f7a3a');rg.addColorStop(.82,'#4c8a40');rg.addColorStop(.9,'#d9c48a');rg.addColorStop(.95,'#e8d7a0');rg.addColorStop(.97,'#3a9ab8');rg.addColorStop(1,'#0b3a5a');
 c.fillStyle=rg;c.beginPath();c.arc(600,600,ISR*s+40,0,7);c.fill();
 const r=rng(7);for(let i=0;i<2600;i++){const a=r()*6.283,d=Math.sqrt(r())*ISR*s*.86;c.fillStyle=r()<.5?'rgba(30,70,30,.25)':'rgba(120,170,80,.18)';c.beginPath();c.arc(600+Math.cos(a)*d,600+Math.sin(a)*d,1+r()*5,0,7);c.fill()}
 for(let i=0;i<60;i++){const a=r()*6.283,d=r()*ISR*s*.8;c.fillStyle='rgba(255,255,170,.35)';c.fillRect(600+Math.cos(a)*d,600+Math.sin(a)*d,2,2)}
 ground=g}
// ---- input ----
const stick={id:null,ox:0,oy:0,x:0,y:0},keys={};let btns=[];

 for(const m of w.mobs){const dx=(m.x-p.x)*Z,dy=(m.y-p.y)*Z;if(Math.abs(dx)<VW/2-20&&Math.abs(dy)<VH/2-20)continue;const a=Math.atan2(dy,dx),r=Math.min(VW,VH)/2-30;ctx.save();ctx.translate(VW/2+Math.cos(a)*r,VH/2+Math.sin(a)*r);ctx.rotate(a);ctx.fillStyle='#b07cffcc';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-7);ctx.lineTo(-6,7);ctx.fill();ctx.restore()}
 if(p.hurt>0){ctx.fillStyle='rgba(255,0,40,'+p.hurt*.6+')';ctx.fillRect(0,0,VW,VH)}
 // buttons
 const tg=target(w);for(const b of btns){ctx.globalAlpha=b.down!=null?1:.85;ctx.fillStyle=b.id==='act'?'#e8652acc':'#ffffff26';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.stroke();
  let lab=b.label;if(b.id==='act'&&tg)lab=tg.kind==='mob'||tg.kind==='crit'?'HIT':tg.kind==='fuel'?'FUEL':tg.o.type==='tree'?'CHOP':tg.o.type==='bush'?'PICK':'MINE';
  ctx.fillStyle='#fff';ctx.font='bold '+Math.round(b.r*.36)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lab,b.x,b.y);
  if(b.id==='craft'&&Object.keys(R).some(k=>canCraft(w,k))){ctx.fillStyle='#ffcf5a';ctx.beginPath();ctx.arc(b.x+b.r*.7,b.y-b.r*.7,8,0,7);ctx.fill()}ctx.textBaseline='alphabetic'}ctx.globalAlpha=1;
 if(stick.id!==null){ctx.strokeStyle='#fff6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(stick.ox,stick.oy,60,0,7);ctx.stroke();const dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.min(60,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(stick.ox+Math.cos(a)*d,stick.oy+Math.sin(a)*d,26,0,7);ctx.fill()}
 else if(hintT<14&&w.day===1){ctx.fillStyle='#fffa';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText('Drag on the left to move. Tap the big button near trees and rocks.',VW/2,VH*.68)}}
// ---- menus ----
const $=id=>document.getElementById(id);
const NAMES={wood:'wood',stone:'stone',iron:'iron',ember:'ember'};
function openCraft(){if(state!=='play')return;state='craft';const g=$('grid');let h='';
 for(const id in R){const rc=R[id],can=canCraft(world,id),have=(rc.tool&&world.p.tools[id])||(id==='torch'&&world.p.torch);
  const cost=Object.keys(rc.c).map(k=>rc.c[k]+' '+NAMES[k]+' ('+(world.p.inv[k]||0)+')').join(', ');
  h+='<button class="it '+(have?'have':can?'yes':'no')+'" data-id="'+id+'"><b>'+rc.n+(have?' &#10003;':'')+'</b>'+rc.d+'<small>'+cost+'</small></button>'}
 g.innerHTML=h;$('craft').classList.remove('hide')}
$('grid').addEventListener('click',e=>{const b=e.target.closest?e.target.closest('.it'):null;if(!b)return;const id=b.getAttribute('data-id');if(craft(world,id)){flushEvents();closeCraft();}else{SFX.whiff()}});
function closeCraft(){$('craft').classList.add('hide');if(state==='craft'){state='play';last=performance.now()}}
$('close').addEventListener('click',closeCraft);
function pauseGame(){if(state!=='play')return;state='paused';$('sub').textContent='Paused';$('msg').innerHTML='Night '+world.day+' of '+LAST_NIGHT+'. Your island is waiting.';$('play').textContent='RESUME';$('ui').classList.remove('hide')}
function showStats(){$('stats').innerHTML='Best: '+save.best+' nights &middot; Escapes: '+save.wins+' &middot; Runs: '+save.runs}
function startGame(){world=newWorld();state='play';hintT=0;last=performance.now();$('ui').classList.add('hide');$('craft').classList.add('hide')}
function endGame(){const n=nightsSurvived(world);save.runs++;if(n>save.best)save.best=n;if(world.won)save.wins++;try{localStorage.setItem('emberisle',JSON.stringify(save))}catch(e){}
 state='over';$('sub').textContent=world.won?'You survived all 10 nights!':'The darkness took you';
 $('msg').innerHTML=(world.won?'A ship spots your fire at dawn. You are rescued!':'Survived '+n+' night'+(n===1?'':'s')+'.')+'<br>Shades banished: '+world.stat.kills+' &middot; Items crafted: '+world.stat.crafted+' &middot; Gathered: '+world.stat.gathered;
 $('play').textContent='PLAY AGAIN';showStats();$('ui').classList.remove('hide')}
$('play').addEventListener('click',()=>{ensureAudio();if(state==='paused'){state='play';last=performance.now();$('ui').classList.add('hide')}else startGame()});
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent='Sound: '+(muted?'OFF':'ON');if(!muted)ensureAudio()});
function flushEvents(){if(!world.evs)return;for(const e of world.evs)if(SFX[e])try{SFX[e]()}catch(x){}world.evs.length=0}
// ---- loop ----
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!world)return;
 if(state==='play'){hintT+=dt;const [mx,my]=moveVec();if(actHeld)act(world);step(world,dt,mx,my);music(dt);flushEvents();if(world.over){render(now/1000);endGame();return}}
 render(now/1000)}
resize();buildGround();world=newWorld(42);showStats();requestAnimationFrame(frame);
</script></body></html>
