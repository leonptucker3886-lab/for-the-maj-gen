else{for(var i=0;i<8;i++){var a=i/8*6.28+t/900;x.beginPath();x.moveTo(Math.cos(a)*r,Math.sin(a)*r);x.lineTo(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5);x.stroke()}x.beginPath();x.arc(0,0,r,0,7);x.fill();x.fillStyle='#ffd166';x.beginPath();x.moveTo(-r*.6,-r*.9);x.lineTo(-r*.3,-r*1.4);x.lineTo(0,-r*1);x.lineTo(r*.3,-r*1.4);x.lineTo(r*.6,-r*.9);x.fill()}
x.shadowBlur=0;x.fillStyle='#fff';var ex=Math.sin(t/1300)*r*.12,ey=k=='boss'?0:-r*.15,er=k=='boss'?r*.45:r*.17;x.beginPath();x.arc(ex,ey,er,0,7);x.fill();x.fillStyle='#120018';x.beginPath();x.arc(ex*1.3,ey,er*.5,0,7);x.fill();x.restore()}
var GLY={strike:'⚔',guard:'⛨',bash:'✸',cleave:'☾',twin:'♊',venom:'☠',wall:'▣',focus:'◎',surge:'⚡',rage:'♨',heavy:'☄',drain:'♥',hex:'✶',parry:'⟲',storm:'✺',thorns:'✣',plague:'☣',echo:'◈'};
var META=JSON.parse(localStorage.gaMeta||'{"ember":0,"hp":0,"str":0,"draw":0,"gold":0,"best":0,"wins":0,"seen":0}');function saveM(){localStorage.gaMeta=JSON.stringify(META)}
var UP=[['hp','Vitality','+6 max HP',5,40],['str','Might','+1 Strength each fight',2,120],['draw','Insight','+1 card on turn 1',1,150],['gold','Fortune','+25 starting gold',3,40]];
var s=null,sel=0,upI=-1,busy=0,foeEls=[],hurt=[];
function cardEl(k,cls){var c=GA.C[k],d=document.createElement('div');d.className='card '+c.t+(cls?' '+cls:'');d.innerHTML='<div class="c">'+c.c+'</div><div class="t">'+c.n+'</div><div class="g">'+GLY[k]+'</div><div class="x">'+c.x+'</div>';return d}
function scr(html){var S=$('S');S.innerHTML=html;S.classList.add('on');return S}function hide(){$('S').classList.remove('on')}
function fx(txt,col,el){var r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},d=document.createElement('div');d.className='fx';d.textContent=txt;d.style.color=col;d.style.left=(r.left+r.width/2-20+Math.random()*20)+'px';d.style.top=(r.top+r.height*.3)+'px';document.body.appendChild(d);setTimeout(function(){d.remove()},900)}
function banner(t){var d=document.createElement('div');d.className='ban';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1200)}
function vib(n){if(navigator.vibrate)try{navigator.vibrate(n)}catch(e){}}
function menu(){setT(0);var h='<h1>GLYPH ASCENT</h1><div class="small">Climb 12 floors of the Rune Spire with a deck of glyph cards.<br>Best floor: '+META.best+' · Wins: '+META.wins+'</div><button id="go" style="flex:0;width:80%;max-width:320px">Begin Ascent</button><h2 style="margin-top:8px">Rune Forge <span class="gd">✦ '+META.ember+'</span></h2><div class="row">';
UP.forEach(function(u,i){var lv=META[u[0]],mx=lv>=u[3],cost=u[4]*(lv+1);h+='<button class="alt up" data-i="'+i+'" style="flex:0 0 46%;font-size:14px;padding:10px 6px'+(mx||META.ember<cost?';opacity:.45':'')+'">'+u[1]+' '+lv+'/'+u[3]+'<br><span class="small">'+u[2]+'</span><br>'+(mx?'MAX':'✦ '+cost)+'</button>'});
var S=scr(h+'</div>');$('go').onclick=function(){au();start()};S.querySelectorAll('.up').forEach(function(b){b.onclick=function(){au();var u=UP[+b.dataset.i],lv=META[u[0]],cost=u[4]*(lv+1);if(lv<u[3]&&META.ember>=cost){META.ember-=cost;META[u[0]]++;saveM();SFX.buff();menu()}else SFX.no()}})}
function start(){s=GA.newRun((Math.random()*1e9)|0,META);mapScr()}
function hud(){$('hpT').textContent='♥ '+Math.max(0,s.hp)+'/'+s.mx;$('flT').textContent='Floor '+(s.floor+1)+'/12';$('gdT').textContent='◆ '+s.gold}
var NODE={fight:['⚔ Battle','#ff5e7e'],elite:['☠ Elite','#ff9f1c'],rest:['☾ Rest','#34f5c5'],shop:['◆ Shop','#ffd166'],boss:['♛ The Crowned Eye','#ff3d81']};
function mapScr(){hud();if(s.floor>=12)return;var o=s.map[s.floor],h='<h2>Floor '+(s.floor+1)+'</h2><div class="small">Choose your path</div><div class="row">';
o.forEach(function(n,i){h+='<button class="node" data-n="'+n+'" style="background:'+NODE[n][1]+'33;border:2px solid '+NODE[n][1]+'">'+NODE[n][0]+'</button>'});
var nx=s.map[s.floor+1];if(nx)h+='</div><div class="small">Next floor: '+nx.map(function(n){return NODE[n][0]}).join(' / ')+'</div>';else h+='</div>';
var S=scr(h);S.querySelectorAll('.node').forEach(function(b){b.onclick=function(){SFX.card();go(b.dataset.n)}})}
function go(n){if(n=='rest'){scr('<h2>☾ Rune Shrine</h2><div class="small">Rest to heal '+Math.round(s.mx*.35)+' HP, or meditate to remove a card.</div><div class="row"><button id="r1">Rest</button><button class="alt" id="r2">Remove a card</button></div>');$('r1').onclick=function(){GA.rest(s);SFX.buff();next()};$('r2').onclick=function(){pickRemove(0)};return}
if(n=='shop')return shop();hide();GA.startFight(s,n);sel=0;upI=-1;setT(n=='boss'||n=='elite'?1:0);buildFoes();render();banner(n=='boss'?'THE CROWNED EYE':n=='elite'?'ELITE FOE':'FLOOR '+(s.floor+1));if(!META.seen)$('hint').textContent='Tap a card to raise it, tap again (or tap a foe) to play it.'}
function next(){s.floor++;if(s.floor>=12)return end();mapScr()}
function pickRemove(price,back){var h='<h2>Remove a card'+(price?' (◆'+price+')':'')+'</h2><div class="cards3" id="rm"></div><button class="alt" id="cx" style="flex:0;width:60%">Cancel</button>',S=scr(h);
s.deck.forEach(function(k,i){var e=cardEl(k);e.style.transform='scale(.8)';e.onclick=function(){if(price?GA.remove(s,i,price):(s.deck.length>5&&s.deck.splice(i,1))){SFX.coin();price?shop(back):next()}else SFX.no()};$('rm').appendChild(e)});$('cx').onclick=function(){price?shop(back):go('rest')}}
function shop(stock){stock=stock||GA.pick3(s.r).map(function(k){return{k:k,p:GA.C[k].c>=2?65:50}});hud();var h='<h2>◆ Glyph Merchant</h2><div class="small">You have ◆ '+s.gold+'</div><div class="cards3" id="sh"></div><div class="row"><button class="alt" id="rmv">Remove a card ◆75</button><button id="lv">Leave</button></div>',S=scr(h);
stock.forEach(function(it,i){var w=document.createElement('div');w.style.textAlign='center';if(it.sold){w.innerHTML='<div class="small" style="width:92px">SOLD</div>'}else{var e=cardEl(it.k,s.gold<it.p?'no':'');w.appendChild(e);w.insertAdjacentHTML('beforeend','<div class="gd" style="margin-top:4px">◆ '+it.p+'</div>');e.onclick=function(){if(GA.buy(s,it.k,it.p)){it.sold=1;SFX.coin();shop(stock)}else SFX.no()}}$('sh').appendChild(w)});
$('rmv').onclick=function(){if(s.gold>=75)pickRemove(75,stock);else SFX.no()};$('lv').onclick=next}
function buildFoes(){var F=s.fight,box=$('foes');box.innerHTML='';foeEls=[];hurt=[];F.en.forEach(function(e,i){var d=document.createElement('div');d.className='foe';d.innerHTML='<div class="intent"></div><canvas width="200" height="200"></canvas><div class="nm">'+e.n+'</div><div class="bar"><i></i></div><div class="st"></div>';d.onclick=function(){if(e.hp<=0)return;sel=i;if(upI>=0)tryPlay(upI);else render()};box.appendChild(d);foeEls.push(d);hurt.push(0)})}
function drawFoes(t){if(!s||!s.fight)return;s.fight.en.forEach(function(e,i){var d=foeEls[i];if(!d)return;if(hurt[i]>0)hurt[i]-=.05;drawFoe(d.querySelector('canvas'),e.k,t,hurt[i])})}
function stTxt(o,extra){var a=[];if(o.str)a.push('<span style="color:#ff9f1c">♨'+o.str+'</span>');if(o.vul)a.push('<span style="color:#ff5ea8">✶Vul '+o.vul+'</span>');if(o.weak)a.push('<span style="color:#aaa">↓Weak '+o.weak+'</span>');if(o.poi)a.push('<span style="color:#5effa0">☠'+o.poi+'</span>');if(o.thorn)a.push('<span style="color:#ffd166">✣'+o.thorn+'</span>');if(o.blk)a.push('<span class="blk">⛨'+o.blk+'</span>');return a.join(' ')}
function intTxt(e,F){var a=GA.intent(e);if(a[0]=='a'){var d=Math.floor((a[1]*e.sc+e.str)*(e.weak?.75:1)*(F.vul?1.5:1));return '<span style="color:#ff6b8b">⚔ '+d+(a[2]>1?'×'+a[2]:'')+'</span>'}if(a[0]=='d')return '<span class="blk">⛨ Guard</span>';if(a[0]=='b')return '<span style="color:#ff9f1c">♨ Empower</span>';return '<span style="color:#c77dff">✶ Curse</span>'}
function render(){var F=s.fight;hud();if(!F)return;var alive=F.en.filter(function(e){return e.hp>0});if(F.en[sel]&&F.en[sel].hp<=0)sel=F.en.indexOf(alive[0]);
F.en.forEach(function(e,i){var d=foeEls[i];d.classList.toggle('dead',e.hp<=0);d.classList.toggle('sel',i==sel&&alive.length>1);d.querySelector('.intent').innerHTML=e.hp>0?intTxt(e,F):'';d.querySelector('.bar i').style.width=Math.max(0,e.hp/e.mx*100)+'%';d.querySelector('.st').innerHTML=Math.max(0,e.hp)+'/'+e.mx+' '+stTxt(e)});
$('en').textContent=F.energy;$('mehp').style.width=(s.hp/s.mx*100)+'%';$('mest').innerHTML='♥ '+s.hp+'/'+s.mx+' '+stTxt({str:F.str,vul:F.vul,weak:F.weak,thorn:F.thorn,blk:F.blk});
$('pileB').textContent='Draw '+F.draw.length+' · Disc '+F.disc.length;
var hd=$('hand');hd.innerHTML='';var n=F.hand.length,ov=n>5?Math.min(40,(n*92-Math.min(innerWidth,520)+20)/n+12):12;F.hand.forEach(function(k,i){var e=cardEl(k,(GA.C[k].c>F.energy?'no':'')+(i==upI?' up':''));if(i!=upI)e.style.margin='0 -'+ov+'px';e.onclick=function(ev){ev.stopPropagation();if(busy)return;au();if(upI==i)tryPlay(i);else{upI=i;SFX.card();render()}};hd.appendChild(e)})}
function tryPlay(i){var F=s.fight,k=F.hand[i];if(!k||busy)return;if(GA.C[k].c>F.energy){SFX.no();fx('Not enough energy','#ff9f1c',$('en'));upI=-1;render();return}
var before=F.en.map(function(e){return e.hp}),blk=F.blk,r=GA.play(s,i,sel);upI=-1;if(!r)return;META.seen=1;$('hint').textContent='';var c=GA.C[k];
F.en.forEach(function(e,j){var dd=before[j]-e.hp;if(dd>0){fx('-'+dd,'#ff5e7e',foeEls[j]);hurt[j]=1;foeEls[j].classList.remove('shake');void foeEls[j].offsetWidth;foeEls[j].classList.add('shake');var rc=foeEls[j].getBoundingClientRect();boom(rc.left+rc.width/2,rc.top+rc.height/2,FOECOL[e.k],dd>15?30:16)}});
if(r.dealt>0){SFX.hit();sh=r.dealt>15?12:5;vib(20)}if(F.blk>blk){SFX.block();fx('+'+(F.blk-blk)+' ⛨','#7ab8ff',$('me'))}if(c.str||c.thorn||c.en||c.draw)SFX.buff();if(c.poi)SFX.poison();
render();if(GA.fightWon(s))setTimeout(won,550)}
$('endB').onclick=function(){if(!s||!s.fight||busy)return;au();busy=1;upI=-1;var hp=s.hp,F=s.fight,ev=GA.endTurn(s),dt=0;
ev.forEach(function(v){setTimeout(function(){if(v.t=='hit'){var d=foeEls[v.i];d.style.transform='translateY(30px) scale(1.1)';setTimeout(function(){d.style.transform=''},180);if(v.d>0){SFX.hurt();sh=10;vib(40);fx('-'+v.d,'#ff3d6e',$('me'));$('flash').style.opacity=.25;setTimeout(function(){$('flash').style.opacity=0},150)}else{SFX.block();fx('Blocked','#7ab8ff',$('me'))}}else{SFX.poison();fx('☠','#5effa0',foeEls[v.i])}},dt);dt+=260});
setTimeout(function(){busy=0;render();if(GA.fightWon(s))won();else if(s.over)end();else if(s.hp<s.mx*.3)$('hint').textContent='Low health! Block before you attack.'},dt+150)};
$('pileB').onclick=function(){if(!s||!s.fight)return;var F=s.fight,S=scr('<h2>Your deck ('+s.deck.length+')</h2><div class="cards3" id="dk"></div><button id="cl" style="flex:0;width:60%">Close</button>');s.deck.slice().sort().forEach(function(k){var e=cardEl(k);e.style.transform='scale(.8)';$('dk').appendChild(e)});$('cl').onclick=hide};
function won(){if(!s.fight)return;var F=s.fight,rw=GA.reward(s);SFX.win();setT(0);hud();if(s.won)return end();
var S=scr('<h2>Victory!</h2><div class="gd">+◆'+rw.gold+' · +✦'+rw.ember+' · +6 ♥'+(rw.elite?' · +5 max HP':'')+'</div><div class="small">Add a glyph to your deck</div><div class="cards3" id="rw"></div><button class="alt" id="sk" style="flex:0;width:60%">Skip</button>');
rw.cards.forEach(function(k){var e=cardEl(k);e.onclick=function(){s.deck.push(k);SFX.card();next()};$('rw').appendChild(e)});$('sk').onclick=next}
function end(){setT(0);var fl=s.won?12:s.floor+1;META.ember+=s.ember;META.best=Math.max(META.best,fl);if(s.won)META.wins++;saveM();s.won?SFX.win():SFX.lose();
var S=scr('<h1>'+(s.won?'ASCENDED':'FALLEN')+'</h1><div>'+(s.won?'The Crowned Eye is broken. The Spire is yours.':'You fell on floor '+fl+'.')+'</div><div class="gd">+✦ '+s.ember+' embers for the Rune Forge</div><button id="mm" style="flex:0;width:70%">Continue</button>');s.fight=null;$('mm').onclick=menu}
document.addEventListener('visibilitychange',function(){if(AC){document.hidden?AC.suspend():AC.resume()}});
document.addEventListener('keydown',function(e){if(!s||!s.fight||$('S').classList.contains('on'))return;var n=+e.key;if(n>=1&&n<=9){if(upI==n-1)tryPlay(n-1);else{upI=n-1;render()}}if(e.key=='e'||e.key=='Enter')$('endB').click();if(e.key=='Tab'){e.preventDefault();var F=s.fight;do{sel=(sel+1)%F.en.length}while(F.en[sel].hp<=0);render()}});
