<style>

<canvas id="c"></canvas>
<div id="ui"><h1>ZONE FALL</h1><h2 id="sub"></h2>
<p id="msg">30 drop in. 1 walks out. Loot fast, fight smart, and stay inside the shrinking storm wall.<br><small>Left thumb: move · Right thumb: aim &amp; fire</small></p>
<button class="btn" id="play">DROP IN</button>
<button class="btn alt" id="mute">Sound: ON</button>

<script>
"use strict";
const W=3000,H=3000,N=30;
const WEAP={
 pistol:{n:"Pistol",dmg:14,rof:3.2,spd:900,spr:.05,rng:520,mag:12,col:"#cfd"},
 smg:{n:"SMG",dmg:8,rof:9.5,spd:950,spr:.12,rng:480,mag:30,col:"#6ef"},
 shotgun:{n:"Shotgun",dmg:11,rof:1.25,spd:800,spr:.28,rng:300,mag:6,pel:7,col:"#fa5"},
 rifle:{n:"Rifle",dmg:15,rof:4.1,spd:1200,spr:.05,rng:700,mag:25,col:"#af6"},
 sniper:{n:"Sniper",dmg:70,rof:.75,spd:2200,spr:.01,rng:1100,mag:5,col:"#f6c"}};
const RAR=[{n:"Common",m:1,c:"#bbb"},{n:"Rare",m:1.15,c:"#4af"},{n:"Epic",m:1.3,c:"#c5f"},{n:"Legend",m:1.45,c:"#fc3"}];
const PHASES=[{wait:75,shrink:45,r:1100,dps:1},{wait:60,shrink:40,r:700,dps:2},{wait:50,shrink:35,r:420,dps:4},{wait:40,shrink:30,r:220,dps:7},{wait:30,shrink:25,r:80,dps:11},{wait:20,shrink:20,r:0,dps:16}];
const BOTN=["Vex","Rook","Juno","Kade","Nyx","Orin","Pike","Rhea","Sol","Tarn","Ula","Wren","Zed","Ash","Bly","Cyra","Dax","Echo","Fen","Gale","Hex","Ivo","Jett","Kira","Lux","Mako","Nova","Odin","Pax","Quill"];
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function mkLoot(R,x,y,inside){const r=R();let it;
 if(r<.45){const ks=["smg","shotgun","rifle","sniper","pistol"],wt=inside?[.28,.24,.26,.12,.1]:[.3,.25,.2,.08,.17];let q=R(),k=0;while(k<4&&q>wt[k]){q-=wt[k];k++}
  const rr=R(),rar=rr<.55?0:rr<.82?1:rr<.95?2:3;it={t:"gun",k:ks[k],r:inside?Math.min(3,rar+(R()<.3?1:0)):rar}}
 else if(r<.65)it={t:"armor",v:R()<.6?25:50};else if(r<.85)it={t:"med",v:1};else it={t:"ammo",v:30};
 it.x=x;it.y=y;return it}
function inBld(w,x,y,p){return w.bld.some(b=>x>b.x-p&&x<b.x+b.w+p&&y>b.y-p&&y<b.y+b.h+p)}
function wallHit(b,x,y,r){const t=10;if(x<b.x-r||x>b.x+b.w+r||y<b.y-r||y>b.y+b.h+r)return false;
 if(y>b.y+b.h/2&&Math.abs(x-(b.x+b.w/2))<36-r)return false;
 return x<b.x+t+r||x>b.x+b.w-t-r||y<b.y+t+r||y>b.y+b.h-t-r}
function blocked(w,x,y,r){if(x<r||y<r||x>W-r||y>H-r)return true;for(const o of w.obs){const dx=x-o.x,dy=y-o.y;if(dx*dx+dy*dy<(o.r+r)**2)return true}
 for(const b of w.bld)if(wallHit(b,x,y,r))return true;return false}
function inWater(w,x,y){return w.water.some(o=>(x-o.x)**2+(y-o.y)**2<o.r*o.r)}
function los(w,x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/30);for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;
 for(const o of w.obs)if(o.k==="rock"&&(x-o.x)**2+(y-o.y)**2<o.r*o.r)return false;for(const b of w.bld)if(wallHit(b,x,y,0))return false}return true}
function newWorld(seed,human){
 const R=rng(seed),w={R,t:0,ents:[],bul:[],loot:[],obs:[],bld:[],water:[],feed:[],alive:N,events:[],over:false,winner:null,
  zone:{x:W/2,y:H/2,r:2200,sx:W/2,sy:H/2,sr:2200,tx:W/2,ty:H/2,tr:PHASES[0].r,ph:0,timer:PHASES[0].wait,shr:false}};
 for(let i=0;i<4;i++)w.water.push({x:300+R()*2400,y:300+R()*2400,r:120+R()*160});
 for(let i=0;i<40&&w.bld.length<20;i++){const b={x:150+R()*2550,y:150+R()*2550,w:150+R()*150,h:130+R()*130};
  if(w.bld.some(o=>b.x<o.x+o.w+70&&b.x+b.w+70>o.x&&b.y<o.y+o.h+70&&b.y+b.h+70>o.y))continue;w.bld.push(b);
  const k=2+(R()*2|0);for(let j=0;j<k;j++)w.loot.push(mkLoot(R,b.x+30+R()*(b.w-60),b.y+30+R()*(b.h-60),true))}
 for(let i=0;i<170;i++){const o={x:R()*W,y:R()*H,k:R()<.7?"tree":"rock"};o.r=o.k==="tree"?18+R()*14:24+R()*20;if(!inBld(w,o.x,o.y,o.r+40))w.obs.push(o)}
 for(let i=0;i<70;i++){const x=100+R()*2800,y=100+R()*2800;if(!blocked(w,x,y,10))w.loot.push(mkLoot(R,x,y,false))}
 pickZone(w);
 for(let i=0;i<N;i++){let x,y;do{x=200+R()*2600;y=200+R()*2600}while(blocked(w,x,y,18));const hu=i===0&&human;
  w.ents.push({id:i,human:hu,x,y,a:R()*6.28,hp:100,ar:0,inv:[{k:"pistol",r:0,am:12}],cur:0,res:36,med:0,cd:0,heal:0,kills:0,alive:true,hurt:0,hurtA:0,place:0,
   ai:{st:"loot",tgt:null,tx:x,ty:y,think:0,skill:.5+R()*.45,strafe:R()<.5?1:-1},name:hu?"You":BOTN[i%30]})}
 return w}
function pickZone(w){const z=w.zone,p=PHASES[z.ph];z.sx=z.x;z.sy=z.y;z.sr=z.r;z.tr=p.r;
 if(z.ph===0){z.tx=W/2+(w.R()-.5)*600;z.ty=H/2+(w.R()-.5)*600;return}
 const a=w.R()*6.28,d=w.R()*Math.max(0,z.r-p.r)*.6;z.tx=Math.min(W-200,Math.max(200,z.x+Math.cos(a)*d));z.ty=Math.min(H-200,Math.max(200,z.y+Math.sin(a)*d))}
function gun(e){return e.inv[e.cur]}
function score(g){const W0=WEAP[g.k];return W0.dmg*(W0.pel||1)*W0.rof*RAR[g.r].m*Math.sqrt(W0.rng/600)}
function move(w,e,mx,my,dt){const l=Math.hypot(mx,my);if(l<.08)return;if(l>1){mx/=l;my/=l}
 const sp=(inWater(w,e.x,e.y)?130:225)*(e.heal>0?.5:1)*dt,nx=e.x+mx*sp,ny=e.y+my*sp;if(!blocked(w,nx,e.y,16))e.x=nx;if(!blocked(w,e.x,ny,16))e.y=ny}
function reload(w,e){const g=gun(e),W0=WEAP[g.k];if(g.am>=W0.mag||e.res<=0||e.cd>0)return;const n=Math.min(W0.mag-g.am,e.res);g.am+=n;e.res-=n;e.cd=1.3;w.events.push({t:"reload",e})}
function shoot(w,e){const g=gun(e);if(e.cd>0||e.heal>0)return false;const W0=WEAP[g.k];if(g.am<=0){reload(w,e);return false}
 g.am--;e.cd=1/W0.rof;const m=RAR[g.r].m,pel=W0.pel||1,sk=e.human?1:1.6-e.ai.skill;
 for(let i=0;i<pel;i++){const a=e.a+(w.R()-.5)*W0.spr*2*sk;w.bul.push({x:e.x+Math.cos(e.a)*24,y:e.y+Math.sin(e.a)*24,vx:Math.cos(a)*W0.spd,vy:Math.sin(a)*W0.spd,d:0,rng:W0.rng,dmg:W0.dmg*m,o:e,col:W0.col})}
 w.events.push({t:"shot",e,k:g.k});return true}
function damage(w,v,dmg,src,ang){if(!v.alive)return;let d=dmg;if(v.ar>0){const ab=Math.min(v.ar,d*.6);v.ar-=ab;d-=ab}
 v.hp-=d*.62;v.hurt=.6;v.hurtA=ang;v.heal=0;w.events.push({t:"hit",v,d:dmg,src});
 if(src&&src!=="zone"&&!v.human){v.ai.tgt=src;v.ai.st="fight"}if(v.hp<=0)kill(w,v,src)}
function kill(w,v,src){v.alive=false;v.place=w.alive;w.alive--;if(src&&src!=="zone")src.kills++;
 w.feed.unshift({t:w.t,txt:(src==="zone"?"The storm":src.name)+" > "+v.name});if(w.feed.length>5)w.feed.pop();
 const g=gun(v);w.loot.push({t:"gun",k:g.k,r:g.r,x:v.x,y:v.y});w.loot.push({t:"ammo",v:Math.max(20,v.res),x:v.x-20,y:v.y});if(v.med)w.loot.push({t:"med",v:v.med,x:v.x+20,y:v.y});
 w.events.push({t:"die",v,src});if(w.alive<=1){w.over=true;w.winner=w.ents.find(e=>e.alive)||null}}
function pickup(w,e,it){const i=w.loot.indexOf(it);if(i<0)return;
 if(it.t==="gun"){const ng={k:it.k,r:it.r,am:WEAP[it.k].mag};if(e.inv.length<2){e.inv.push(ng);e.cur=1}else{const old=e.inv[e.cur];e.inv[e.cur]=ng;w.loot.push({t:"gun",k:old.k,r:old.r,x:e.x+(w.R()-.5)*30,y:e.y+20})}}
 else if(it.t==="armor"){if(e.ar>=it.v&&e.ar>=50)return;e.ar=Math.min(100,e.ar+it.v)}else if(it.t==="med")e.med+=it.v;else e.res+=it.v;
 w.loot.splice(i,1);w.events.push({t:"pick",e,it})}
function useMed(w,e){if(e.med>0&&e.hp<100&&e.heal<=0){e.heal=2.5;w.events.push({t:"heal",e})}}
function lootWanted(e,it){if(it.t==="gun"){const g=gun(e);if(e.inv.length<2&&it.k!==e.inv[0].k)return 1.2;return score(it)>score(g)*1.12?1.5:0}
 if(it.t==="armor")return e.ar<50?1.3:0;if(it.t==="med")return e.med<3?.9:0;return e.res<90?.8:0}
function aiThink(w,e){const ai=e.ai,z=w.zone;ai.think=.25+w.R()*.2;
 if(ai.tgt&&(!ai.tgt.alive||Math.hypot(ai.tgt.x-e.x,ai.tgt.y-e.y)>650||w.R()<.04))ai.tgt=null;
 const dz=Math.hypot(e.x-z.x,e.y-z.y),nz=Math.hypot(e.x-z.tx,e.y-z.ty);
 let best=null,bd=1e9;for(const o of w.ents){if(o===e||!o.alive)continue;const d=Math.hypot(o.x-e.x,o.y-e.y);if(d<bd&&d<200+ai.skill*160&&los(w,e.x,e.y,o.x,o.y)){bd=d;best=o}}
 if(best&&(!ai.tgt||bd<Math.hypot(ai.tgt.x-e.x,ai.tgt.y-e.y)*.7))ai.tgt=best;
 if(e.hp<35&&e.med>0&&(!ai.tgt||bd>500)){ai.st="heal";return}
 if(dz>z.r-60||(z.shr&&nz>z.tr+40)||(z.timer<18&&nz>z.tr)){ai.st="zone";ai.tx=z.tx+(w.R()-.5)*z.tr*.6;ai.ty=z.ty+(w.R()-.5)*z.tr*.6;if(!ai.tgt||e.hp<50)return}
 if(ai.tgt){ai.st=e.hp<25&&ai.tgt.hp>e.hp*1.5?"flee":"fight";return}
 let bl=null,bs=0;for(const it of w.loot){const v=lootWanted(e,it);if(!v)continue;const d=Math.hypot(it.x-e.x,it.y-e.y);if(d>700)continue;const s=v/(d+80);if(s>bs&&Math.hypot(it.x-z.tx,it.y-z.ty)<Math.max(z.tr,z.r*.8)){bs=s;bl=it}}
 if(bl){ai.st="loot";ai.tx=bl.x;ai.ty=bl.y;ai.item=bl;return}
 ai.st="roam";if(Math.hypot(ai.tx-e.x,ai.ty-e.y)<60){const a=w.R()*6.28,r=w.R()*Math.max(100,z.tr*.8);ai.tx=z.tx+Math.cos(a)*r;ai.ty=z.ty+Math.sin(a)*r}}
function aiStep(w,e,dt){const ai=e.ai;ai.think-=dt;if(ai.think<=0)aiThink(w,e);let mx=0,my=0;
 const go=(x,y)=>{const dx=x-e.x,dy=y-e.y,d=Math.hypot(dx,dy)||1;mx=dx/d;my=dy/d;
  if(blocked(w,e.x+mx*26,e.y+my*26,16)){const s=ai.strafe;const ax=-my*s,ay=mx*s;mx=mx*.3+ax;my=my*.3+ay;if(w.R()<.01)ai.strafe*=-1}};
 if(ai.st==="heal"){useMed(w,e);if(ai.tgt){const a=Math.atan2(e.y-ai.tgt.y,e.x-ai.tgt.x);mx=Math.cos(a)*.6;my=Math.sin(a)*.6}}
 else if(ai.st==="fight"&&ai.tgt){const t=ai.tgt,d=Math.hypot(t.x-e.x,t.y-e.y),W0=WEAP[gun(e).k];const ang=Math.atan2(t.y-e.y,t.x-e.x);
  const want=Math.min(W0.rng*.6,450);
  if(w.t<40){mx=-Math.cos(ang)*.5;my=-Math.sin(ang)*.5;return[mx,my]}const lead=d/W0.spd*ai.skill*.8;const ta=Math.atan2(t.y+(t.vy||0)*lead-e.y,t.x+(t.vx||0)*lead-e.x);
  let da=ta-e.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;e.a+=da*Math.min(1,dt*(4+ai.skill*6));
  const fwd=d>want?1:d<want*.6?-.7:0;mx=Math.cos(ang)*fwd+Math.cos(ang+1.57)*ai.strafe*.8;my=Math.sin(ang)*fwd+Math.sin(ang+1.57)*ai.strafe*.8;
  if(w.R()<dt*.6)ai.strafe*=-1;if(w.t>40&&Math.abs(da)<.18&&d<W0.rng*.95&&los(w,e.x,e.y,t.x,t.y))shoot(w,e);else if(gun(e).am===0)reload(w,e)}
 else if(ai.st==="flee"&&ai.tgt){const a=Math.atan2(e.y-ai.tgt.y,e.x-ai.tgt.x);go(e.x+Math.cos(a)*200,e.y+Math.sin(a)*200)}
 else{go(ai.tx,ai.ty);if(Math.hypot(mx,my)>.1)e.a=Math.atan2(my,mx);
  if(ai.st==="loot"&&ai.item&&Math.hypot(ai.item.x-e.x,ai.item.y-e.y)<36){pickup(w,e,ai.item);ai.item=null;ai.think=0}
  if(gun(e).am<WEAP[gun(e).k].mag*.5)reload(w,e);if(e.inv.length===2&&score(e.inv[1-e.cur])>score(gun(e)))e.cur=1-e.cur}
 return[mx,my]}
function step(w,dt,input){w.t+=dt;w.events.length=0;const z=w.zone,P=PHASES[Math.min(z.ph,PHASES.length-1)];
 z.timer-=dt;if(!z.shr&&z.timer<=0){z.shr=true;z.timer=P.shrink;w.events.push({t:"shrink"})}
 else if(z.shr){const k=1-Math.max(0,z.timer)/P.shrink;z.x=z.sx+(z.tx-z.sx)*k;z.y=z.sy+(z.ty-z.sy)*k;z.r=z.sr+(z.tr-z.sr)*k;
  if(z.timer<=0){z.shr=false;if(z.ph<PHASES.length-1){z.ph++;z.timer=PHASES[z.ph].wait;pickZone(w);w.events.push({t:"newzone"})}else z.timer=1e9}}
 for(const e of w.ents){if(!e.alive)continue;const ox=e.x,oy=e.y;e.cd=Math.max(0,e.cd-dt);e.hurt=Math.max(0,e.hurt-dt);
  if(e.heal>0){e.heal-=dt;if(e.heal<=0){e.med--;e.hp=Math.min(100,e.hp+50);w.events.push({t:"healed",e})}}
  if(e.human&&input){move(w,e,input.mx,input.my,dt);if(input.aim)e.a=input.aim;if(input.fire)shoot(w,e)}
  else if(!e.human){const[mx,my]=aiStep(w,e,dt);move(w,e,mx,my,dt)}
  e.vx=(e.x-ox)/dt;e.vy=(e.y-oy)/dt;
  if(Math.hypot(e.x-z.x,e.y-z.y)>z.r){e.zt=(e.zt||0)+dt;if(e.zt>=.5){e.zt-=.5;damage(w,e,P.dps*.5*(z.shr?1:1),"zone",0)}}else e.zt=0}
 for(let i=w.bul.length-1;i>=0;i--){const b=w.bul[i],sx=b.vx*dt,sy=b.vy*dt,n=Math.ceil(Math.hypot(sx,sy)/20);let dead=false;
  for(let s=0;s<n&&!dead;s++){b.x+=sx/n;b.y+=sy/n;b.d+=Math.hypot(sx,sy)/n;
   for(const o of w.obs)if((b.x-o.x)**2+(b.y-o.y)**2<o.r*o.r){dead=true;w.events.push({t:"spark",x:b.x,y:b.y});break}
   if(!dead)for(const bd of w.bld)if(wallHit(bd,b.x,b.y,0)){dead=true;w.events.push({t:"spark",x:b.x,y:b.y});break}
   if(!dead)for(const e of w.ents)if(e.alive&&e!==b.o&&(b.x-e.x)**2+(b.y-e.y)**2<18*18){const fall=b.d>b.rng*.7?.6:1;damage(w,e,b.dmg*fall,b.o,Math.atan2(-b.vy,-b.vx));dead=true;break}}
  if(dead||b.d>b.rng)w.bul.splice(i,1)}}
if(typeof module!=="undefined")module.exports={newWorld,step,WEAP,RAR,PHASES,gun,score,W,H,N,pickup,useMed,reload,shoot,blocked,inWater,los,wallHit};
// ===== CLIENT =====
const cv=document.getElementById("c"),cx=cv.getContext("2d"),ui=document.getElementById("ui");
let DPR=1,VW=0,VH=0;function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR|0;cv.height=VH*DPR|0}
addEventListener("resize",resize);resize();
let world=null,me=null,cam={x:0,y:0,shake:0},parts=[],floats=[],state="menu",paused=false,hitMark=0,last=0,zoom=1;
const LS="zonefall_stats";let ST={games:0,wins:0,best:99,kills:0};try{Object.assign(ST,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
function saveST(){try{localStorage.setItem(LS,JSON.stringify(ST))}catch(e){}}
function showStats(){document.getElementById("stats").textContent=ST.games?`Games ${ST.games} · Wins ${ST.wins} · Best place #${ST.best} · Total kills ${ST.kills}`:""}
showStats();
const sticks={L:{id:null,ox:0,oy:0,x:0,y:0},R:{id:null,ox:0,oy:0,x:0,y:0}};const keys={};const mouse={x:0,y:0,down:false,used:false};
function btns(){const s=Math.max(64,Math.min(VW,VH)*.15),x=VW-s*.6-12;return[
 {id:"pick",x,y:VH*.42-s*1.1,r:s*.5,l:"GRAB"},{id:"swap",x,y:VH*.42,r:s*.42,l:"SWAP"},{id:"heal",x,y:VH*.42+s,r:s*.42,l:"HEAL"},{id:"pause",x:VW-32,y:32,r:24,l:"II"}]}
function tap(id){if(id==="pause"){togglePause();return}if(!me||!me.alive)return;

// ---- flow ----
function showMenu(title,msg,btn,sub){ui.classList.remove("hide");ui.querySelector("h1").textContent=title;document.getElementById("msg").innerHTML=msg;document.getElementById("play").textContent=btn;document.getElementById("sub").textContent=sub||"";showStats()}
function startGame(){world=newWorld((Math.random()*1e9)|0,true);me=world.ents[0];buildGround(world);cam.x=me.x;cam.y=me.y;parts=[];floats=[];paused=false;state="play";ui.classList.add("hide");banner("DROP ZONE: LOOT FAST","#5ef");last=performance.now()}
function endGame(win){if(state!=="play")return;state="over";const place=win?1:me.place;ST.games++;ST.kills+=me.kills;if(win)ST.wins++;ST.best=Math.min(ST.best,place);saveST();sfx(win?"win":"lose");
 setTimeout(()=>showMenu(win?"LAST ONE STANDING":"ELIMINATED",`Placed <b>#${place}</b> of 30 · <b>${me.kills}</b> kills · survived ${Math.floor(world.t/60)}m ${Math.floor(world.t%60)}s`,"DROP AGAIN",win?"🏆 Victory!":""),win?900:1400)}
document.getElementById("play").addEventListener("click",()=>{audioInit();if(paused&&state==="play"){paused=false;ui.classList.add("hide");last=performance.now();return}startGame()});
document.getElementById("mute").addEventListener("click",e=>{muted=!muted;e.target.textContent="Sound: "+(muted?"OFF":"ON");if(master)master.gain.value=muted?0:.6;if(!muted)audioInit()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"&&!paused)togglePause()});
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(state==="menu"||!world){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle="#0b1020";cx.fillRect(0,0,VW,VH);return}
 if(state==="play"&&!paused){const inp=readInput();step(world,dt,me.alive?inp:null);handleEvents(world);music(dt)}
 else if(state==="over"&&!world.over){step(world,dt,null)}
 draw(state==="play"&&!paused?dt:0)}
requestAnimationFrame(frame);
</script></body></html>
