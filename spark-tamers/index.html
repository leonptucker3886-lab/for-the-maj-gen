<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#05070d;color:#eef;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-weight:700;font-size:14px;text-shadow:0 0 6px #000}
#hud .pill{background:#0b1022cc;border:1px solid #2c3d7a;border-radius:20px;padding:6px 12px}
.btn{pointer-events:auto;background:linear-gradient(#1d2a5c,#111a3a);border:2px solid #4b6cff;color:#fff;border-radius:16px;font-weight:800;font-size:16px;min-height:56px;padding:8px 14px;box-shadow:0 0 12px #4b6cff55}
.btn:active{transform:scale(.96);filter:brightness(1.3)}
.btn[disabled]{opacity:.35}
#acts{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}
#acts .btn{width:76px;height:64px;border-radius:50%;font-size:13px}
#battle{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);display:none;background:linear-gradient(#0000,#05070df0 25%)}
#msg{min-height:48px;font-size:16px;font-weight:600;padding:8px 6px;line-height:1.3}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#grid .btn{font-size:15px;min-height:60px;text-align:left;line-height:1.15}
#grid .btn small{display:block;font-size:11px;opacity:.8;font-weight:600}
.ov{position:fixed;inset:0;background:#05070df2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:auto}
.ov h1{font-size:44px;letter-spacing:2px;background:linear-gradient(90deg,#ff5a3c,#ffe03c,#4be37a,#3ca8ff,#b05cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #4b6cff)}
.ov p{max-width:420px;opacity:.9;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:#0e1530;border:2px solid #2c3d7a;border-radius:14px;padding:10px;width:150px;pointer-events:auto}
.card canvas{position:static;width:96px;height:96px}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 52px);left:50%;transform:translateX(-50%);background:#101a3cee;border:1px solid #4b6cff;border-radius:12px;padding:8px 14px;font-weight:700;display:none;max-width:90%;text-align:center}
.plist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.pm{display:flex;align-items:center;gap:10px;background:#0e1530;border:2px solid #2c3d7a;border-radius:14px;padding:8px;text-align:left;min-height:64px}
.pm canvas{position:static;width:52px;height:52px;flex:none}
.bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
</style></head><body>

<script>
// ===== Spark Tamers core (shared by game + simulator) =====
var TN=['Ember','Tide','Leaf','Volt','Stone','Shade'];
var TC=['#ff5a3c','#3ca8ff','#4be37a','#ffe03c','#d6a865','#b05cff'];
var EFF=[[0.5,0.5,2,1,0.5,1],[2,0.5,0.5,1,2,1],[0.5,2,0.5,1,2,1],[1,2,0.5,0.5,0,1],[2,1,0.5,2,1,1],[1,1,1,1,1,1.5]];
var MV={
 tackle:{n:'Bump',t:4,p:40,a:100},
 spark:{n:'Cinder',t:0,p:45,a:100},blaze:{n:'Flare Burst',t:0,p:80,a:90},inferno:{n:'Sunfire',t:0,p:110,a:80},
 splash:{n:'Ripple',t:1,p:45,a:100},surge:{n:'Tide Lash',t:1,p:80,a:90},torrent:{n:'Maelstrom',t:1,p:110,a:80},
 vine:{n:'Thorn Whip',t:2,p:45,a:100},bloom:{n:'Petal Storm',t:2,p:80,a:90},grove:{n:'Ancient Root',t:2,p:110,a:80},
 zap:{n:'Static',t:3,p:45,a:100},bolt:{n:'Arc Bolt',t:3,p:80,a:90},storm:{n:'Skystrike',t:3,p:110,a:80},
 pebble:{n:'Pebble Toss',t:4,p:45,a:100},slam:{n:'Boulder Slam',t:4,p:80,a:90},quake:{n:'Fault Line',t:4,p:110,a:80},
 hex:{n:'Hex',t:5,p:45,a:100},gloom:{n:'Night Fang',t:5,p:80,a:90},voidp:{n:'Void Pulse',t:5,p:110,a:80},
 guard:{n:'Brace',t:-1,p:0,a:100,fx:'def'},focus:{n:'Focus',t:-1,p:0,a:100,fx:'atk'},mend:{n:'Mend',t:-1,p:0,a:100,fx:'heal'}
};
var SP=[
 {n:'Cindrel',t:0,b:[45,55,40,60],r:.45,l:[[1,'tackle'],[1,'spark'],[6,'focus'],[12,'blaze'],[24,'inferno']],e:[16,1]},
 {n:'Pyrolynx',t:0,b:[68,82,58,85],r:.2,l:[[1,'tackle'],[1,'spark'],[6,'focus'],[12,'blaze'],[18,'pebble'],[22,'inferno']]},
 {n:'Drizzlet',t:1,b:[50,48,52,50],r:.45,l:[[1,'tackle'],[1,'splash'],[7,'guard'],[12,'surge'],[24,'torrent']],e:[16,3]},
 {n:'Abyssor',t:1,b:[80,74,76,62],r:.2,l:[[1,'tackle'],[1,'splash'],[7,'guard'],[12,'surge'],[18,'zap'],[22,'torrent']]},
 {n:'Sproutle',t:2,b:[52,50,50,46],r:.45,l:[[1,'tackle'],[1,'vine'],[5,'mend'],[12,'bloom'],[24,'grove']],e:[16,5]},
 {n:'Thornbark',t:2,b:[82,72,80,54],r:.2,l:[[1,'tackle'],[1,'vine'],[5,'mend'],[12,'bloom'],[18,'pebble'],[22,'grove']]},
 {n:'Voltick',t:3,b:[40,52,36,72],r:.5,l:[[1,'tackle'],[1,'zap'],[8,'focus'],[13,'bolt'],[25,'storm']],e:[17,7]},
 {n:'Stormane',t:3,b:[62,84,54,96],r:.18,l:[[1,'tackle'],[1,'zap'],[8,'focus'],[13,'bolt'],[19,'hex'],[23,'storm']]},
 {n:'Grubbit',t:4,b:[55,50,65,30],r:.55,l:[[1,'tackle'],[1,'pebble'],[6,'guard'],[13,'slam'],[25,'quake']],e:[17,9]},
 {n:'Cragmaw',t:4,b:[86,80,96,40],r:.18,l:[[1,'tackle'],[1,'pebble'],[6,'guard'],[13,'slam'],[19,'spark'],[23,'quake']]},
 {n:'Wispkin',t:5,b:[44,56,40,64],r:.4,l:[[1,'tackle'],[1,'hex'],[7,'mend'],[14,'gloom'],[26,'voidp']],e:[18,11]},
 {n:'Nocturne',t:5,b:[66,88,58,82],r:.15,l:[[1,'tackle'],[1,'hex'],[7,'mend'],[14,'gloom'],[20,'surge'],[24,'voidp']]},
 {n:'Mossling',t:2,b:[48,44,46,58],r:.6,l:[[1,'tackle'],[1,'vine'],[9,'zap'],[15,'bloom']]},
 {n:'Puddlepip',t:1,b:[46,46,44,60],r:.6,l:[[1,'tackle'],[1,'splash'],[9,'pebble'],[15,'surge']]},
 {n:'Aurorath',t:3,b:[90,95,85,90],r:.06,l:[[1,'bolt'],[1,'voidp'],[1,'storm'],[1,'mend']]}
];
var ZONES=[
 {n:'Glowmeadow',pool:[12,13,0,2,4,8],lv:[2,6]},
 {n:'Static Marsh',pool:[13,6,8,2,10,12],lv:[7,12]},
 {n:'Ember Ridge',pool:[0,8,10,6,4,9],lv:[12,18]},
 {n:'Nightspire',pool:[10,7,11,9,3,5,14],lv:[18,25]}
];
var WARDENS=[
 {n:'Warden Fen',team:[[12,8],[13,9]],gold:60},
 {n:'Warden Volta',team:[[6,13],[8,13],[7,15]],gold:120},
 {n:'Warden Kael',team:[[9,18],[1,19],[11,20]],gold:200},
 {n:'Grand Tamer Nyx',team:[[11,25],[3,25],[5,25],[7,26]],gold:500}
];
function rnd(R){return R?R():Math.random()}
function stat(b,L){return Math.floor(b*2*L/100)+5}
function calc(m){var b=SP[m.id].b;m.mhp=Math.floor(b[0]*2*m.L/100)+m.L+10;m.atk=stat(b[1],m.L);m.def=stat(b[2],m.L);m.spd=stat(b[3],m.L)}
function weakest(m){var w=null,wp=1e9;m.moves.forEach(function(k){var p=MV[k].p||30;if(p<wp){wp=p;w=k}});return w}
function mkMon(id,L){var s=SP[id],m={id:id,L:L,xp:0,moves:[]};
 for(var i=0;i<s.l.length;i++)if(s.l[i][0]<=L&&m.moves.indexOf(s.l[i][1])<0)m.moves.push(s.l[i][1]);
 while(m.moves.length>4)m.moves.splice(m.moves.indexOf(weakest(m)),1);
 calc(m);m.hp=m.mhp;return m}
function xpNeed(L){return Math.floor(L*L*1.15)+10}
function xpGain(f,tr){return Math.floor((SP[f.id].b[0]+SP[f.id].b[1])*f.L/12*(tr?1.5:1))}
function giveXP(m,x){var ev=[];m.xp+=x;
 while(m.L<50&&m.xp>=xpNeed(m.L)){m.xp-=xpNeed(m.L);var oh=m.mhp;m.L++;calc(m);m.hp=Math.min(m.mhp,m.hp+m.mhp-oh);ev.push({k:'lvl',L:m.L});
  var s=SP[m.id];
  for(var i=0;i<s.l.length;i++)if(s.l[i][0]==m.L&&m.moves.indexOf(s.l[i][1])<0){
   if(m.moves.length>=4){var w=weakest(m);m.moves.splice(m.moves.indexOf(w),1);ev.push({k:'forget',mv:w})}
   m.moves.push(s.l[i][1]);ev.push({k:'learn',mv:s.l[i][1]})}
  if(s.e&&m.L>=s.e[0]){var f=m.hp/m.mhp;m.id=s.e[1];calc(m);m.hp=Math.max(1,Math.round(m.mhp*f));ev.push({k:'evo',to:m.id})}}
 return ev}
function eff(mt,dt){return mt<0?1:EFF[mt][dt]}
function dmg(a,d,k,R,crit){var mv=MV[k];if(!mv.p)return 0;
 var ba=a.bst||{atk:0,def:0},bd=d.bst||{atk:0,def:0};
 var A=a.atk*(1+.5*ba.atk),D=d.def*(1+.5*bd.def);
 var base=((2*a.L/5+2)*mv.p*A/D)/50+2,stab=mv.t==SP[a.id].t?1.5:1;
 return Math.max(1,Math.floor(base*stab*eff(mv.t,SP[d.id].t)*(crit?1.5:1)*(0.85+0.15*rnd(R))))}
function useMove(a,d,k,R){var mv=MV[k],o={k:k,hit:true,dmg:0,e:1,crit:false};
 if(rnd(R)*100>=mv.a){o.hit=false;return o}
 a.bst=a.bst||{atk:0,def:0};
 if(mv.fx=='atk'){o.fx=a.bst.atk<2;a.bst.atk=Math.min(2,a.bst.atk+1);return o}
 if(mv.fx=='def'){o.fx=a.bst.def<2;a.bst.def=Math.min(2,a.bst.def+1);return o}
 if(mv.fx=='heal'){o.heal=Math.min(Math.ceil(a.mhp*.4),a.mhp-a.hp);a.hp+=o.heal;return o}
 o.crit=rnd(R)<1/16;o.e=eff(mv.t,SP[d.id].t);o.dmg=Math.min(d.hp,dmg(a,d,k,R,o.crit));d.hp-=o.dmg;return o}
// AI move choice: expected damage, heal when low, buff early
function aiMove(a,d,smart,R){var best=a.moves[0],bv=-1;
 a.moves.forEach(function(k){var mv=MV[k],v;
  if(mv.fx=='heal')v=a.hp<a.mhp*.35?999:-1;
  else if(mv.fx)v=(a.hp>a.mhp*.7&&(a.bst?(mv.fx=='atk'?a.bst.atk:a.bst.def):0)<1)?(smart?30:15):-1;
  else{var mid=((2*a.L/5+2)*mv.p*a.atk/d.def/50+2)*(mv.t==SP[a.id].t?1.5:1)*eff(mv.t,SP[d.id].t);v=mid*mv.a/100;if(mid>=d.hp)v+=500*mv.a/100}
  v*=smart?1:(0.6+0.8*rnd(R));if(v>bv){bv=v;best=k}});return best}
function catchChance(m,orb){var r=SP[m.id].r*(orb==2?2.2:orb==1?1.5:1);return Math.min(0.97,r*(1.25-m.hp/m.mhp)*1.3)}
function wildFor(z,R){var Z=ZONES[z];var id=Z.pool[Math.floor(rnd(R)*Z.pool.length)];
 if(id==14&&rnd(R)>0.25)id=Z.pool[0];
 var L=Z.lv[0]+Math.floor(rnd(R)*(Z.lv[1]-Z.lv[0]+1));return mkMon(id,L)}
function speedFirst(a,b,R){return a.spd>b.spd||(a.spd==b.spd&&rnd(R)<.5)}

// ===== audio =====
var AC=null,MUTE=false,musT=0,musStep=0,MG=null;
function au(){if(AC)return;try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,ty,v,sl,dl){if(!AC||MUTE)return;try{var t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,fq){if(!AC||MUTE)return;try{var n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=fq||1200;g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(MG);s.start()}catch(e){}}
var SFX={
 step:function(){tone(180,.04,'triangle',.03)},
 grass:function(){noise(.08,.05,2500)},
 enc:function(){for(var i=0;i<6;i++)tone(300+i*120,.08,'square',.08,null,i*.06)},
 hit:function(e){noise(.18,.3,e>1?3000:1200);tone(e>1?220:140,.15,'sawtooth',.12,60)},
 miss:function(){tone(500,.15,'sine',.08,200)},
 buff:function(){tone(400,.1,'triangle',.1,800);tone(600,.15,'triangle',.08,1200,.1)},
 heal:function(){[523,659,784].forEach(function(f,i){tone(f,.2,'sine',.1,null,i*.08)})},
 faint:function(){tone(400,.6,'sawtooth',.12,60)},
 orb:function(){tone(900,.1,'square',.08,300);tone(300,.08,'square',.06,null,.15)},
 wobble:function(){tone(200,.08,'triangle',.1)},
 caught:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.18,'square',.08,null,i*.1)})},
 lvl:function(){[659,784,988,1319].forEach(function(f,i){tone(f,.12,'triangle',.1,null,i*.07)})},
 evo:function(){for(var i=0;i<12;i++)tone(300+i*80,.15,'sine',.07,null,i*.08)},
 tap:function(){tone(700,.04,'square',.05)},
 win:function(){[523,523,784,1047].forEach(function(f,i){tone(f,.25,'square',.09,null,i*.15)})}
};
// procedural music: overworld (major) vs battle (minor, faster)
var SC_OW=[0,2,4,7,9,12,14,16],SC_BT=[0,3,5,7,10,12,15,17];
function music(dt,mode){if(!AC||MUTE||AC.state!='running')return;musT-=dt;if(musT>0)return;
 var bt=mode=='battle',spb=bt?.13:.2;musT=spb;var s=musStep++,root=bt?(s%64<32?110:98):(s%64<32?131:147),sc=bt?SC_BT:SC_OW;
 if(s%4==0)tone(root/2,spb*3,'triangle',bt?.13:.09);
 if(bt&&s%2==0)noise(.03,.05,6000);if(bt&&s%8==4)noise(.1,.12,900);
 var pat=bt?[0,2,4,2,5,4,2,1]:[0,2,4,5,4,2,3,1];
 if(s%2==0||bt)tone(root*2*Math.pow(2,sc[(pat[s%8]+Math.floor(s/16))%sc.length]/12),spb*1.6,bt?'sawtooth':'square',bt?.035:.03);
}
// ===== creature art =====
function drawMon(g,id,x,y,sz,t,flip,alpha){var s=SP[id],c=TC[s.t],ev=!!(id%2==1&&id<12)||id==14;g.save();g.translate(x,y);if(flip)g.scale(-1,1);g.globalAlpha=alpha==null?1:alpha;
 var bob=Math.sin(t*3+id)*sz*.04,k=sz/100;g.translate(0,bob);
 g.shadowColor=c;g.shadowBlur=20*k;
 // features behind
 g.fillStyle=c;
 if(s.t==0){for(var i=0;i<(ev?5:3);i++){var a=-1.2+i*(2.4/((ev?5:3)-1));g.beginPath();g.moveTo(Math.sin(a)*30*k,-30*k);g.quadraticCurveTo(Math.sin(a)*60*k,(-70-Math.sin(t*8+i)*8)*k,Math.sin(a)*45*k,-95*k*(ev?1.1:.8));g.quadraticCurveTo(Math.sin(a)*20*k,-50*k,0,-35*k);g.fill()}}
 if(s.t==1){g.beginPath();g.moveTo(-10*k,-40*k);g.quadraticCurveTo(0,-90*k,30*k,-70*k);g.quadraticCurveTo(10*k,-55*k,15*k,-35*k);g.fill();if(ev){g.beginPath();g.moveTo(40*k,10*k);g.quadraticCurveTo(85*k,-10*k,75*k,30*k);g.fill();g.beginPath();g.moveTo(-40*k,10*k);g.quadraticCurveTo(-85*k,-10*k,-75*k,30*k);g.fill()}}
 if(s.t==2){for(var i=0;i<(ev?4:2);i++){g.save();g.rotate(-.6+i*(1.2/Math.max(1,(ev?3:1))));g.beginPath();g.ellipse(0,-55*k,12*k,30*k,0,0,7);g.fillStyle=i%2?'#2fb35a':c;g.fill();g.restore()}}
 if(s.t==3){g.strokeStyle=c;g.lineWidth=7*k;for(var i=-1;i<=1;i+=2){g.beginPath();g.moveTo(i*20*k,-35*k);g.lineTo(i*40*k,-65*k);g.lineTo(i*28*k,-62*k);g.lineTo(i*50*k,-95*k*(ev?1.1:.85));g.stroke()}}
 if(s.t==4){g.fillStyle='#8a6a3e';for(var i=0;i<(ev?5:3);i++){g.beginPath();var bx=(-30+i*(60/((ev?5:3)-1)))*k;g.moveTo(bx-12*k,-30*k);g.lineTo(bx,-58*k-(i%2)*14*k);g.lineTo(bx+12*k,-30*k);g.fill()}}
 if(s.t==5){g.globalAlpha*=.6;for(var i=0;i<3;i++){g.beginPath();g.arc(Math.sin(t*2+i*2)*55*k,Math.cos(t*2+i*2)*30*k-20*k,9*k,0,7);g.fill()}g.globalAlpha/=.6}
 // body
 var gr=g.createRadialGradient(-12*k,-15*k,5*k,0,0,48*k*(ev?1.15:1));gr.addColorStop(0,'#fff');gr.addColorStop(.25,c);gr.addColorStop(1,shade(c));
 g.fillStyle=gr;g.beginPath();var bw=(ev?52:42)*k,bh=(ev?46:38)*k;
 if(s.t==4){g.moveTo(-bw,bh*.6);g.lineTo(-bw*.8,-bh);g.lineTo(bw*.7,-bh*1.05);g.lineTo(bw,bh*.5);g.lineTo(0,bh*1.1);g.closePath()}else g.ellipse(0,0,bw,bh+Math.sin(t*4)*2*k,0,0,7);g.fill();
 g.shadowBlur=0;
 // feet
 g.fillStyle=shade(c);g.beginPath();g.ellipse(-bw*.5,bh*.95,12*k,7*k,0,0,7);g.ellipse(bw*.5,bh*.95,12*k,7*k,0,0,7);g.fill();
 // eyes
 var bl=(Math.floor(t*10+id*7)%37)==0;g.fillStyle='#fff';[-1,1].forEach(function(sx){g.beginPath();g.ellipse(sx*16*k,-8*k,10*k,bl?1.5*k:12*k,0,0,7);g.fill()});
 if(!bl){g.fillStyle=s.t==5?'#ff3c9a':'#111';[-1,1].forEach(function(sx){g.beginPath();g.arc(sx*16*k+3*k,-6*k,5.5*k,0,7);g.fill()});g.fillStyle='#fff';[-1,1].forEach(function(sx){g.beginPath();g.arc(sx*16*k+5*k,-9*k,2*k,0,7);g.fill()})}
 if(ev){g.strokeStyle='#111';g.lineWidth=3*k;[-1,1].forEach(function(sx){g.beginPath();g.moveTo(sx*26*k,-24*k);g.lineTo(sx*8*k,-19*k);g.stroke()})}
 g.strokeStyle='#111';g.lineWidth=3*k;g.beginPath();g.arc(0,8*k,8*k,.2,Math.PI-.2);g.stroke();

 for(var i=0;i<40;i++){g.fillStyle='rgba(255,255,255,'+(.2+.3*Math.sin(T*2+i))+')';g.fillRect((i*97)%VW,(i*53)%(VH*.4),2,2)}

 if(f&&!a.orb){var fa=a.fs<0?Math.max(0,1+a.fs):a.fs;if(a.fs<0)a.fs-=dt*2;var ofs=a.fl>0?-Math.sin(a.fl/.35*Math.PI)*30:0;
